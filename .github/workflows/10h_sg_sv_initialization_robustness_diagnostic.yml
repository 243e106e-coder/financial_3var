name: Financial 3var 10h SG SV-initialization robustness diagnostic

on:
  workflow_dispatch:
    inputs:
      original_run_id:
        description: "Original Trade-W run containing exact validated input artifact"
        required: true
        default: "34056102906"
        type: string
      model_ref:
        description: "Exact statistical-model code SHA"
        required: true
        default: "710aea67d12ed8b38bdc2e275e27448241653299"
        type: string
      burn_per_chain:
        description: "Outer MCMC burn-in per chain"
        required: true
        default: "12500"
        type: string
      postburn_per_chain:
        description: "Outer post-burn MCMC iterations per chain"
        required: true
        default: "50000"
        type: string
      stored_per_chain:
        description: "Strictly post-burn stored draws per chain"
        required: true
        default: "2000"
        type: string
      sv_inner_burnin:
        description: "Invariant conditional SV transitions; keep 4 for direct comparability with 10c"
        required: true
        default: "4"
        type: string
      seed_base:
        description: "Fresh base seed; mode-specific offsets are added automatically"
        required: true
        default: "20266391"
        type: string
      max_parallel:
        description: "Maximum simultaneous SG chain jobs"
        required: true
        default: "12"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify_input:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
      MODEL_REF: ${{ inputs.model_ref }}
    steps:
      - name: Checkout exact model code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.model_ref }}

      - name: Verify exact code and Trade-W input artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${MODEL_REF}" || {
            echo "::error::Checked-out SHA does not equal model_ref."
            exit 1
          }

          for f in R/00_config.R R/60_formal_bayesian_tvp_gvar.R; do
            test -f "${f}" || {
              echo "::error::Missing ${f}"
              exit 1
            }
          done

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_RUN_ID}")"

          test "$(jq -r '.status' <<<"${run_json}")" = "completed" || {
            echo "::error::Original run is not completed."
            exit 1
          }

          test "$(jq -r '.path' <<<"${run_json}")" = ".github/workflows/10_trade_network_end_to_end.yml" || {
            echo "::error::Unexpected original workflow path."
            exit 1
          }

          artifact_name="financial-3var-10-trade-input-trade_2000_2012-${ORIGINAL_RUN_ID}"

          n="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_RUN_ID}/artifacts?per_page=100" \
              --jq \
              "[.artifacts[]
                | select(.expired == false and .name == \"${artifact_name}\")
               ] | length"
          )"

          test "${n}" = "1" || {
            echo "::error::Expected exactly one original Trade-W input artifact; found ${n}."
            exit 1
          }

          echo "10H INPUT INTEGRITY: PASS"

  estimate:
    needs: verify_input
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        init_mode: [legacy, ols_centered, diffuse]
        chain: [1, 2, 3, 4]

    env:
      FIN3_NETWORK: "trade_2000_2012"
      FIN3_COUNTRY: "SG"
      FIN3_CHAIN_ID: ${{ matrix.chain }}
      FIN3_BURN: ${{ inputs.burn_per_chain }}
      FIN3_KEEP: ${{ inputs.postburn_per_chain }}
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_SEED_BASE_RAW: ${{ inputs.seed_base }}
      FIN3_SV_INIT_MODE: ${{ matrix.init_mode }}
      FIN3_SV_INNER_BURNIN: ${{ inputs.sv_inner_burnin }}
      FIN3_TTVP_B1: "2"
      FIN3_TTVP_B2: "1"
      FIN3_TTVP_KAPPA0: "1e-4"
      FIN3_SV_ON: "true"
      FIN3_TVS_ON: "true"
      FIN3_FORMAL_PANEL: "data/derived/panel_domestic_fin3_rate_diff.csv"

    steps:
      - name: Checkout exact model code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.model_ref }}

      - name: Download exact original Trade-W input
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-trade_2000_2012-${{ inputs.original_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.original_run_id }}

      - name: Verify 10h diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          test -f data/derived/panel_domestic_fin3_rate_diff.csv
          test -f data/weights/W_trade_2000_2012.csv
          test -f results/events/00_event_calendar.csv

          test "${FIN3_COUNTRY}" = "SG"
          test "${FIN3_NETWORK}" = "trade_2000_2012"
          test "${FIN3_SV_ON}" = "true"
          test "${FIN3_TVS_ON}" = "true"
          test "${FIN3_TTVP_B1}" = "2"
          test "${FIN3_TTVP_B2}" = "1"
          test "${FIN3_TTVP_KAPPA0}" = "1e-4"

          case "${FIN3_SV_INIT_MODE}" in
            legacy|ols_centered|diffuse) ;;
            *)
              echo "::error::Unexpected SV init mode ${FIN3_SV_INIT_MODE}"
              exit 1
              ;;
          esac

          python3 - <<'PY'
          import os
          burn = int(os.environ["FIN3_BURN"])
          keep = int(os.environ["FIN3_KEEP"])
          stored = int(os.environ["FIN3_STORED_PER_CHAIN"])
          inner = int(os.environ["FIN3_SV_INNER_BURNIN"])

          if burn < 5000:
              raise SystemExit("burn_per_chain must be >= 5000.")
          if keep < 10000:
              raise SystemExit("postburn_per_chain must be >= 10000.")
          if stored < 1000:
              raise SystemExit("stored_per_chain must be >= 1000.")
          if stored >= keep:
              raise SystemExit("stored_per_chain must be smaller than postburn_per_chain.")
          if inner < 1 or inner > 20:
              raise SystemExit("sv_inner_burnin must be between 1 and 20.")
          PY

          echo "10H DIAGNOSTIC CONTRACT: PASS"

      - name: Resolve independent mode-specific seed
        shell: bash
        run: |
          set -euo pipefail
          case "${FIN3_SV_INIT_MODE}" in
            legacy)       offset=0 ;;
            ols_centered) offset=100000 ;;
            diffuse)      offset=200000 ;;
          esac

          resolved=$(( FIN3_SEED_BASE_RAW + offset ))
          echo "FIN3_SEED_BASE=${resolved}" >> "${GITHUB_ENV}"
          echo "init_mode=${FIN3_SV_INIT_MODE}"
          echo "resolved_seed_base=${resolved}"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install formal TVP dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::RcppArmadillo
            any::stochvol
            any::GIGrvg
            any::MASS
            any::dlm
            any::snowfall

      - name: Install pinned threshtvp with sampler-only diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          THRESHTVP_SHA="c0133f262fcf0f935805168f8b7def02b43dc6d5"

          rm -rf threshtvp_src
          git clone https://github.com/gregorkastner/threshtvp.git threshtvp_src
          git -C threshtvp_src checkout --detach "${THRESHTVP_SHA}"
          test "$(git -C threshtvp_src rev-parse HEAD)" = "${THRESHTVP_SHA}"

          find threshtvp_src/src \
            -maxdepth 1 \
            -type f \
            \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) \
            -delete

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path("threshtvp_src/R/MCMC_function.R")
          s = p.read_text(encoding="utf-8")

          start_marker = "MCMC_tvp <- function"
          end_marker = "VAR_posterior <- function"
          start = s.find(start_marker)
          end = s.find(end_marker, start)

          if start < 0 or end < 0:
              raise SystemExit("Could not isolate MCMC_tvp() in pinned source.")

          prefix = s[:start]
          block = s[start:end]
          suffix = s[end:]

          inner = int(os.environ["FIN3_SV_INNER_BURNIN"])
          old_call = "draws=1, burnin=0"
          new_call = f"draws=1, burnin={inner}"

          if block.count(old_call) != 1:
              raise SystemExit(
                  f"Expected exactly one '{old_call}' inside MCMC_tvp(); "
                  f"found {block.count(old_call)}."
              )

          block = block.replace(old_call, new_call, 1)

          old_init = (
              '    svdraw <- list(para=c(mu=-10,phi=.9,sigma=.2,latent0=-10),'
              'latent=rep(-3,T))'
          )

          if block.count(old_init) != 1:
              raise SystemExit(
                  "Expected exactly one original svdraw initialization inside MCMC_tvp()."
              )

          new_init = "\\n".join([
              '    sv_init_mode <- tolower(trimws(Sys.getenv("FIN3_SV_INIT_MODE", "legacy")))',
              '    if (sv_init_mode == "legacy") {',
              '      svdraw <- list(',
              '        para=c(mu=-10, phi=.9, sigma=.2, latent0=-10),',
              '        latent=rep(-3, T)',
              '      )',
              '    } else {',
              '      sv_init_var <- max(as.numeric(sig.OLS), 1e-6)',
              '      sv_init_mu <- log(sv_init_var)',
              '',
              '      if (sv_init_mode == "ols_centered") {',
              '        sv_init_phi <- .9',
              '        sv_init_sigma <- .2',
              '        sv_init_latent <- rep(sv_init_mu, T)',
              '      } else if (sv_init_mode == "diffuse") {',
              '        sv_init_mu <- sv_init_mu + log(2)',
              '        sv_init_phi <- .5',
              '        sv_init_sigma <- .6',
              '        sv_init_latent <- rep(sv_init_mu, T)',
              '      } else {',
              '        stop(paste0("Unknown FIN3_SV_INIT_MODE: ", sv_init_mode))',
              '      }',
              '',
              '      svdraw <- list(',
              '        para=c(',
              '          mu=sv_init_mu,',
              '          phi=sv_init_phi,',
              '          sigma=sv_init_sigma,',
              '          latent0=sv_init_mu',
              '        ),',
              '        latent=sv_init_latent',
              '      )',
              '    }'
          ])

          block = block.replace(old_init, new_init, 1)

          patched = prefix + block + suffix
          p.write_text(patched, encoding="utf-8")

          if patched.count(new_call) != 1:
              raise SystemExit("Expected exactly one patched MCMC_tvp SV call.")
          if "FIN3_SV_INIT_MODE" not in block:
              raise SystemExit("SV initialization patch was not installed.")

          print("10H sampler-only patches installed.")
          print("SV inner burnin:", inner)
          PY

          grep -n \
            -E "FIN3_SV_INIT_MODE|svsample_fast_cpp\(y=u_, draws=1, burnin=" \
            threshtvp_src/R/MCMC_function.R

          R CMD INSTALL \
            --preclean \
            --clean \
            --no-multiarch \
            --with-keep.source \
            threshtvp_src

          Rscript --vanilla - <<'RS'
          stopifnot(requireNamespace("threshtvp", quietly=TRUE))
          cat("Pinned patched threshtvp installed.\n")
          RS

      - name: Record 10h sampler-initialization audit
        shell: bash
        run: |
          set -euo pipefail
          root="results/formal_tvp_parts/SG/chain_${FIN3_CHAIN_ID}"
          mkdir -p "${root}"

          cat > "${root}/00_10h_sampler_initialization_audit.csv" <<EOF
          Country,Chain,InitMode,ResolvedSeedBase,StatisticalModelSHA,ThreshtvpSHA,Network,Panel,TVS,SV,B1,B2,Kappa0,SVInnerBurnin,Burn,PostBurnInternal,StoredDraws,StatisticalModelChanged,PriorChanged,GateChanged
          SG,${FIN3_CHAIN_ID},${FIN3_SV_INIT_MODE},${FIN3_SEED_BASE},${{ inputs.model_ref }},c0133f262fcf0f935805168f8b7def02b43dc6d5,trade_2000_2012,panel_domestic_fin3_rate_diff.csv,TRUE,TRUE,2,1,1e-4,${FIN3_SV_INNER_BURNIN},${FIN3_BURN},${FIN3_KEEP},${FIN3_STORED_PER_CHAIN},FALSE,FALSE,FALSE
          EOF

      - name: Run SG SV-initialization robustness MCMC
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          source("R/00_config.R")
          if (MAIN_NETWORK != "trade_2000_2012") {
            stop("Unexpected network: ", MAIN_NETWORK)
          }
          if (!file.exists(network_path(MAIN_NETWORK))) {
            stop("Selected Trade-W matrix missing.")
          }

          cat("MAIN_NETWORK=", MAIN_NETWORK, "\n")
          cat("COUNTRY=", Sys.getenv("FIN3_COUNTRY"), "\n")
          cat("CHAIN=", Sys.getenv("FIN3_CHAIN_ID"), "\n")
          cat("SV_INIT_MODE=", Sys.getenv("FIN3_SV_INIT_MODE"), "\n")
          cat("SV_INNER_BURNIN=", Sys.getenv("FIN3_SV_INNER_BURNIN"), "\n")
          RS

          Rscript --vanilla R/60_formal_bayesian_tvp_gvar.R

      - name: Validate posterior metadata
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          cc <- "SG"
          ch <- as.integer(Sys.getenv("FIN3_CHAIN_ID"))
          root <- file.path(
            "results","formal_tvp_parts",cc,paste0("chain_", ch)
          )

          f <- list.files(
            root,
            pattern=paste0("^formal_tvp_", cc, "_chain", ch, "[.]rds$"),
            full.names=TRUE
          )

          if (length(f) != 1L) {
            stop("Expected exactly one posterior RDS; found ", length(f))
          }

          z <- readRDS(f)

          stopifnot(as.character(z$meta$country) == cc)
          stopifnot(as.integer(z$meta$chain) == ch)
          stopifnot(as.integer(z$meta$burn) == as.integer(Sys.getenv("FIN3_BURN")))
          stopifnot(as.integer(z$meta$keep_internal) == as.integer(Sys.getenv("FIN3_KEEP")))
          stopifnot(as.integer(z$meta$stored_draws) == as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN")))
          stopifnot(isTRUE(z$meta$sv_on))
          stopifnot(isTRUE(z$meta$tvs_on))
          stopifnot(abs(as.numeric(z$meta$prior_B1)-2) < 1e-12)
          stopifnot(abs(as.numeric(z$meta$prior_B2)-1) < 1e-12)
          stopifnot(abs(as.numeric(z$meta$kappa0)-1e-4) < 1e-12)
          stopifnot(
            basename(as.character(z$meta$source_panel)) ==
              "panel_domestic_fin3_rate_diff.csv"
          )
          stopifnot(
            as.character(z$meta$main_network) ==
              "trade_2000_2012"
          )

          cat("10H POSTERIOR METADATA: PASS\n")
          RS

      - name: Build per-chain numerical-degeneracy audit
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          ch <- as.integer(Sys.getenv("FIN3_CHAIN_ID"))
          mode <- Sys.getenv("FIN3_SV_INIT_MODE")
          root <- file.path(
            "results","formal_tvp_parts","SG",paste0("chain_", ch)
          )

          f <- file.path(root, "02_chain_monitor_summary.csv")
          if (!file.exists(f)) stop("Missing chain monitor summary: ", f)

          x <- read.csv(f, stringsAsFactors=FALSE, check.names=FALSE)
          need <- c("Parameter","Mean","SD")
          if (!all(need %in% names(x))) stop("Unexpected chain-monitor schema.")

          v0 <- grepl("__V0__", x$Parameter, fixed=TRUE)

          degenerate <- (
            v0 &
            is.finite(x$Mean) &
            is.finite(x$SD) &
            abs(x$Mean) < 1e-12 &
            x$SD < 1e-14
          )

          audit <- data.frame(
            Country="SG",
            Chain=ch,
            InitMode=mode,
            MonitoredParameters=nrow(x),
            V0Parameters=sum(v0),
            DegenerateV0Parameters=sum(degenerate),
            Status=ifelse(any(degenerate), "FAIL_DEGENERATE_V0", "PASS"),
            stringsAsFactors=FALSE
          )

          write.csv(
            audit,
            file.path(root, "05_chain_degeneracy_audit.csv"),
            row.names=FALSE
          )

          if (any(degenerate)) {
            write.csv(
              x[degenerate,,drop=FALSE],
              file.path(root, "06_degenerate_parameters.csv"),
              row.names=FALSE
            )
            cat("::warning::Numerically degenerate V0 parameter(s) detected.\n")
          } else {
            cat("10H CHAIN DEGENERACY AUDIT: PASS\n")
          }
          RS

      - name: Upload 10h SG posterior part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10h-sg-svinit-${{ matrix.init_mode }}-chain${{ matrix.chain }}-${{ github.run_id }}
          path: results/formal_tvp_parts/SG/chain_${{ matrix.chain }}/
          if-no-files-found: warn
          retention-days: 30

  diagnose:
    needs: [verify_input, estimate]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_RHAT_TARGET: "1.01"
      FIN3_RHAT_HARD: "1.05"
      FIN3_ESS_TARGET: "400"
      FIN3_ESS_HARD: "100"

    steps:
      - name: Checkout exact model code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.model_ref }}

      - name: Download all 12 SG initialization-stress posterior parts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10h-sg-svinit-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install modern convergence dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::posterior

      - name: Run within-mode and pooled initialization diagnostics
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          if (!requireNamespace("posterior", quietly=TRUE)) {
            stop("posterior package is required.")
          }

          root <- "posterior_parts"
          out <- file.path("results", "10h_sg_svinit_diagnostic")
          dir.create(out, recursive=TRUE, showWarnings=FALSE)

          expected_stored <- as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN"))
          rhat_target <- as.numeric(Sys.getenv("FIN3_RHAT_TARGET"))
          rhat_hard <- as.numeric(Sys.getenv("FIN3_RHAT_HARD"))
          ess_target <- as.numeric(Sys.getenv("FIN3_ESS_TARGET"))
          ess_hard <- as.numeric(Sys.getenv("FIN3_ESS_HARD"))

          rds_files <- list.files(
            root,
            pattern="^formal_tvp_SG_chain[1-4][.]rds$",
            recursive=TRUE,
            full.names=TRUE
          )

          if (length(rds_files) != 12L) {
            stop("Expected 12 SG posterior RDS files; found ", length(rds_files))
          }

          index_rows <- lapply(rds_files, function(f) {
            d <- dirname(f)
            audit_file <- file.path(d, "00_10h_sampler_initialization_audit.csv")
            deg_file <- file.path(d, "05_chain_degeneracy_audit.csv")

            if (!file.exists(audit_file)) stop("Missing sampler audit beside ", f)
            if (!file.exists(deg_file)) stop("Missing degeneracy audit beside ", f)

            a <- read.csv(audit_file, stringsAsFactors=FALSE, check.names=FALSE)
            g <- read.csv(deg_file, stringsAsFactors=FALSE, check.names=FALSE)
            z <- readRDS(f)

            data.frame(
              File=f,
              Country=as.character(z$meta$country),
              Chain=as.integer(z$meta$chain),
              InitMode=as.character(a$InitMode[1]),
              StoredDraws=as.integer(z$meta$stored_draws),
              SV=isTRUE(z$meta$sv_on),
              TVS=isTRUE(z$meta$tvs_on),
              PriorB1=as.numeric(z$meta$prior_B1),
              PriorB2=as.numeric(z$meta$prior_B2),
              Kappa0=as.numeric(z$meta$kappa0),
              DegenerateV0=as.integer(g$DegenerateV0Parameters[1]),
              stringsAsFactors=FALSE
            )
          })

          idx <- do.call(rbind, index_rows)

          expected_modes <- c("legacy","ols_centered","diffuse")
          expected_grid <- expand.grid(
            InitMode=expected_modes,
            Chain=1:4,
            stringsAsFactors=FALSE
          )

          got_keys <- paste(idx$InitMode, idx$Chain, sep="||")
          exp_keys <- paste(expected_grid$InitMode, expected_grid$Chain, sep="||")

          if (anyDuplicated(got_keys)) stop("Duplicate InitMode/Chain posterior part.")
          missing <- setdiff(exp_keys, got_keys)
          if (length(missing)) {
            stop("Missing posterior combinations: ", paste(missing, collapse=", "))
          }

          stopifnot(all(idx$Country == "SG"))
          stopifnot(all(idx$StoredDraws == expected_stored))
          stopifnot(all(idx$SV))
          stopifnot(all(idx$TVS))
          stopifnot(all(abs(idx$PriorB1 - 2) < 1e-12))
          stopifnot(all(abs(idx$PriorB2 - 1) < 1e-12))
          stopifnot(all(abs(idx$Kappa0 - 1e-4) < 1e-12))

          write.csv(
            idx[order(match(idx$InitMode, expected_modes), idx$Chain),],
            file.path(out, "00_parts_index.csv"),
            row.names=FALSE
          )

          calc_param_diag <- function(chain_mats, group_name) {
            ref_names <- colnames(chain_mats[[1]])

            if (is.null(ref_names) || !length(ref_names)) {
              stop("No monitored parameters for ", group_name)
            }

            if (!all(vapply(
              chain_mats,
              function(x) identical(colnames(x), ref_names),
              logical(1)
            ))) {
              stop("Parameter names differ across chains for ", group_name)
            }

            if (!all(vapply(chain_mats, nrow, integer(1)) == expected_stored)) {
              stop("Draw counts differ across chains for ", group_name)
            }

            rows <- lapply(seq_along(ref_names), function(pp) {
              mat <- do.call(cbind, lapply(chain_mats, function(x) x[,pp]))

              finite <- all(is.finite(mat))
              chain_sd <- apply(mat, 2, stats::sd)
              constant <- finite && all(chain_sd < 1e-12)

              if (!finite || constant) {
                rh <- eb <- et <- NA_real_
              } else {
                rh <- tryCatch(posterior::rhat(mat), error=function(e) NA_real_)
                eb <- tryCatch(posterior::ess_bulk(mat), error=function(e) NA_real_)
                et <- tryCatch(posterior::ess_tail(mat), error=function(e) NA_real_)
              }

              data.frame(
                Group=group_name,
                Parameter=ref_names[pp],
                Chains=ncol(mat),
                DrawsPerChain=nrow(mat),
                Finite=finite,
                ConstantAcrossAllChains=constant,
                Rhat=rh,
                ESS_Bulk=eb,
                ESS_Tail=et,
                PassRhatTarget=if (is.finite(rh)) rh <= rhat_target else NA,
                PassRhatHard=if (is.finite(rh)) rh <= rhat_hard else NA,
                PassESSBulkTarget=if (is.finite(eb)) eb >= ess_target else NA,
                PassESSTailTarget=if (is.finite(et)) et >= ess_target else NA,
                PassESSBulkHard=if (is.finite(eb)) eb >= ess_hard else NA,
                PassESSTailHard=if (is.finite(et)) et >= ess_hard else NA,
                stringsAsFactors=FALSE
              )
            })

            do.call(rbind, rows)
          }

          get_chain_mats <- function(subidx) {
            subidx <- subidx[order(subidx$Chain),,drop=FALSE]
            lapply(subidx$File, function(f) {
              z <- readRDS(f)
              as.matrix(z$monitor)
            })
          }

          within_rows <- list()
          mode_summary <- list()

          for (mode in expected_modes) {
            sub <- idx[idx$InitMode == mode,,drop=FALSE]
            mats <- get_chain_mats(sub)
            d <- calc_param_diag(mats, mode)
            within_rows[[mode]] <- d

            active <- d[
              d$Finite &
              !d$ConstantAcrossAllChains &
              is.finite(d$Rhat) &
              is.finite(d$ESS_Bulk) &
              is.finite(d$ESS_Tail),
              ,
              drop=FALSE
            ]

            mode_summary[[mode]] <- data.frame(
              InitMode=mode,
              ActiveDiagnostics=nrow(active),
              MaxRhat=max(active$Rhat, na.rm=TRUE),
              MinESSBulk=min(active$ESS_Bulk, na.rm=TRUE),
              MinESSTail=min(active$ESS_Tail, na.rm=TRUE),
              RhatTargetShare=mean(active$Rhat <= rhat_target, na.rm=TRUE),
              ESSBulkTargetShare=mean(active$ESS_Bulk >= ess_target, na.rm=TRUE),
              ESSTailTargetShare=mean(active$ESS_Tail >= ess_target, na.rm=TRUE),
              HardPass=(
                max(active$Rhat, na.rm=TRUE) <= rhat_hard &&
                min(active$ESS_Bulk, na.rm=TRUE) >= ess_hard &&
                min(active$ESS_Tail, na.rm=TRUE) >= ess_hard
              ),
              stringsAsFactors=FALSE
            )
          }

          within <- do.call(rbind, within_rows)
          mode_sum <- do.call(rbind, mode_summary)

          write.csv(
            within,
            file.path(out, "01_parameter_diagnostics_by_init.csv"),
            row.names=FALSE
          )

          write.csv(
            mode_sum,
            file.path(out, "02_init_mode_summary.csv"),
            row.names=FALSE
          )

          pooled_idx <- idx[
            order(match(idx$InitMode, expected_modes), idx$Chain),
            ,
            drop=FALSE
          ]

          pooled_mats <- lapply(pooled_idx$File, function(f) {
            z <- readRDS(f)
            as.matrix(z$monitor)
          })

          pooled <- calc_param_diag(pooled_mats, "POOLED_12_CHAINS")

          write.csv(
            pooled,
            file.path(out, "03_pooled_parameter_diagnostics.csv"),
            row.names=FALSE
          )

          pooled_active <- pooled[
            pooled$Finite &
            !pooled$ConstantAcrossAllChains &
            is.finite(pooled$Rhat) &
            is.finite(pooled$ESS_Bulk) &
            is.finite(pooled$ESS_Tail),
            ,
            drop=FALSE
          ]

          pooled_summary <- data.frame(
            Chains=12,
            ActiveDiagnostics=nrow(pooled_active),
            MaxRhat=max(pooled_active$Rhat, na.rm=TRUE),
            MinESSBulk=min(pooled_active$ESS_Bulk, na.rm=TRUE),
            MinESSTail=min(pooled_active$ESS_Tail, na.rm=TRUE),
            RhatTargetShare=mean(pooled_active$Rhat <= rhat_target, na.rm=TRUE),
            ESSBulkTargetShare=mean(pooled_active$ESS_Bulk >= ess_target, na.rm=TRUE),
            ESSTailTargetShare=mean(pooled_active$ESS_Tail >= ess_target, na.rm=TRUE),
            HardPass=(
              max(pooled_active$Rhat, na.rm=TRUE) <= rhat_hard &&
              min(pooled_active$ESS_Bulk, na.rm=TRUE) >= ess_hard &&
              min(pooled_active$ESS_Tail, na.rm=TRUE) >= ess_hard
            ),
            stringsAsFactors=FALSE
          )

          write.csv(
            pooled_summary,
            file.path(out, "04_pooled_summary.csv"),
            row.names=FALSE
          )

          key <- c(
            "r__coef__2008Q3__r_L1",
            "r__coef__2020Q1__r_L1",
            "r__coef__2024Q2__r_L1",
            "r__sv_mu",
            "r__sv_phi",
            "r__sv_sigma",
            "r__V0__r_L1",
            "r__omega__r_L1",
            "r__threshold__r_L1"
          )

          key_rows <- list()
          pos <- 0L

          for (ii in seq_len(nrow(idx))) {
            z <- readRDS(idx$File[ii])
            m <- as.matrix(z$monitor)
            present <- intersect(key, colnames(m))

            for (nm in present) {
              pos <- pos + 1L
              x <- m[,nm]

              key_rows[[pos]] <- data.frame(
                InitMode=idx$InitMode[ii],
                Chain=idx$Chain[ii],
                Parameter=nm,
                Mean=mean(x),
                SD=stats::sd(x),
                Q05=stats::quantile(x, .05, names=FALSE),
                Median=stats::median(x),
                Q95=stats::quantile(x, .95, names=FALSE),
                stringsAsFactors=FALSE
              )
            }
          }

          key_summary <- do.call(rbind, key_rows)

          write.csv(
            key_summary[
              order(
                match(key_summary$Parameter, key),
                match(key_summary$InitMode, expected_modes),
                key_summary$Chain
              ),
            ],
            file.path(out, "05_chain_key_parameter_summary.csv"),
            row.names=FALSE
          )

          hard_fail <- pooled_active[
            pooled_active$Rhat > rhat_hard |
            pooled_active$ESS_Bulk < ess_hard |
            pooled_active$ESS_Tail < ess_hard,
            ,
            drop=FALSE
          ]

          write.csv(
            hard_fail,
            file.path(out, "06_pooled_hard_fail_parameters.csv"),
            row.names=FALSE
          )

          all_degeneracy_pass <- all(idx$DegenerateV0 == 0L)
          within_all_hard_pass <- all(mode_sum$HardPass)
          pooled_hard_pass <- isTRUE(pooled_summary$HardPass[1])

          decision <- data.frame(
            Diagnostic="10h_SG_SV_initialization_robustness",
            StatisticalModelChanged=FALSE,
            PriorChanged=FALSE,
            GateChanged=FALSE,
            All12ChainDegeneracyAuditsPass=all_degeneracy_pass,
            EveryInitModeHardPass=within_all_hard_pass,
            Pooled12ChainHardPass=pooled_hard_pass,
            InitializationRobust=(
              all_degeneracy_pass &&
              within_all_hard_pass &&
              pooled_hard_pass
            ),
            AuthorizationForIRF=FALSE,
            NextInterpretation=if (
              all_degeneracy_pass &&
              within_all_hard_pass &&
              pooled_hard_pass
            ) {
              paste(
                "SG mixing is robust to widely separated legal SV starting values",
                "under the unchanged posterior target. This still does NOT authorize IRF;",
                "rebuild and gate the complete 14-country formal specification first."
              )
            } else {
              paste(
                "SG remains initialization-sensitive or poorly mixed under the unchanged",
                "posterior target. Do NOT run IRF, do NOT discard chains, and do NOT",
                "loosen thresholds."
              )
            },
            stringsAsFactors=FALSE
          )

          write.csv(
            decision,
            file.path(out, "07_decision.csv"),
            row.names=FALSE
          )

          cat("\n================ 10H MODE SUMMARY ================\n")
          print(mode_sum, row.names=FALSE)

          cat("\n================ 10H POOLED SUMMARY ==============\n")
          print(pooled_summary, row.names=FALSE)

          cat("\n================ 10H DECISION ====================\n")
          print(decision, row.names=FALSE)

          if (!decision$InitializationRobust[1]) {
            stop(
              "10h SG initialization-robustness diagnostic failed. ",
              "Do NOT run IRF and do NOT loosen thresholds."
            )
          }

          cat(
            "\n10H DIAGNOSTIC PASS: initialization robustness supported. ",
            "This is NOT the 14-country formal convergence gate and does NOT authorize IRF.\n",
            sep=""
          )
          RS

      - name: Upload 10h diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10h-sg-svinit-diagnostic-${{ github.run_id }}
          path: results/10h_sg_svinit_diagnostic/
          if-no-files-found: warn
          retention-days: 30
