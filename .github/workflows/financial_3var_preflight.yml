name: Financial 3var preflight

on:
  workflow_dispatch:
  push:
    paths:
      - "financial_3var/**"
      - ".github/workflows/financial_3var_preflight.yml"

jobs:
  financial-3var-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "financial_3var/20_build_financial_3var_input.R"
            "financial_3var/21_financial_weight_preflight.R"
            "financial_3var/22_financial_3var_stability.R"
            "financial_3var/GCAP_financial_W_2017.csv"
            "8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"
            "8.12/gpr_quarterly_processed.csv"
            "8.12/IMF_Brent_quarterly_log_2000Q1_2026Q2.csv"
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
            echo "FOUND: $f"
          done

      - name: Build 3-variable financial input
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla financial_3var/20_build_financial_3var_input.R

      - name: Run financial-weight preflight
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla financial_3var/21_financial_weight_preflight.R

      - name: Run 3-variable stability diagnostics
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla financial_3var/22_financial_3var_stability.R

      - name: Show key results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FINANCIAL WEIGHT PREFLIGHT ==="
          test -f financial_3var/results/preflight/01_weight_preflight_summary.csv &&             cat financial_3var/results/preflight/01_weight_preflight_summary.csv || true

          echo
          echo "=== GLOBAL STABILITY COMPARISON ==="
          test -f financial_3var/results/stability/01_global_stability_comparison.csv &&             cat financial_3var/results/stability/01_global_stability_comparison.csv || true

          echo
          echo "=== LOCAL STABILITY ==="
          test -f financial_3var/results/stability/02_local_stability_summary.csv &&             cat financial_3var/results/stability/02_local_stability_summary.csv || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-preflight-${{ github.run_id }}
          path: |
            financial_3var/results/
            financial_3var/data/
          if-no-files-found: warn
          retention-days: 30
