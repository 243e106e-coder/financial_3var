name: Financial 3var preflight

on:
  workflow_dispatch:
  push:
    paths:
      - "R/**"
      - "data/GCAP_financial_W_2017.csv"
      - ".github/workflows/financial_3var_preflight.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Fetch validated source inputs
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --filter=blob:none --sparse             https://github.com/243e106e-coder/tvp-gvar-replication-private.git source_repo

          git -C source_repo sparse-checkout set 8.12

          echo "=== CHECK SOURCE FILES ==="
          test -f "source_repo/8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"             || { echo "::error::Missing macro workbook"; exit 1; }

          test -f "source_repo/8.12/gpr_quarterly_processed.csv"             || { echo "::error::Missing GPR file"; exit 1; }

          test -f "source_repo/8.12/IMF_Brent_quarterly_log_2000Q1_2026Q2.csv"             || { echo "::error::Missing Brent file"; exit 1; }

          test -f "source_repo/8.12/Trade_Weights_14_Economies_2000_2014.csv"             || { echo "::error::Missing legacy trade-weight file"; exit 1; }

          echo "=== CHECK NEW REPOSITORY FILES ==="
          test -f "R/20_build_financial_3var_input.R"             || { echo "::error::Missing R/20_build_financial_3var_input.R"; exit 1; }

          test -f "R/21_financial_weight_preflight.R"             || { echo "::error::Missing R/21_financial_weight_preflight.R"; exit 1; }

          test -f "R/22_financial_3var_stability.R"             || { echo "::error::Missing R/22_financial_3var_stability.R"; exit 1; }

          test -f "data/GCAP_financial_W_2017.csv"             || { echo "::error::Missing data/GCAP_financial_W_2017.csv"; exit 1; }

          echo "All required files found."

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl

      - name: Build 3-variable input
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/20_build_financial_3var_input.R

      - name: Validate financial weights
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/21_financial_weight_preflight.R

      - name: Run p1 q1 stability diagnostic
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/22_financial_3var_stability.R

      - name: Show key results
        if: always()
        shell: bash
        run: |
          echo "=== BUILD SUMMARY ==="
          cat data/derived/build_summary.txt || true

          echo
          echo "=== WEIGHT PREFLIGHT ==="
          cat results/preflight/README_preflight.txt || true

          echo
          echo "=== GLOBAL STABILITY COMPARISON ==="
          cat results/stability/01_global_stability_comparison.csv || true

          echo
          echo "=== STABILITY README ==="
          cat results/stability/README_stability.txt || true

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-preflight-${{ github.run_id }}
          path: |
            data/derived/
            results/
          if-no-files-found: warn
          retention-days: 30
