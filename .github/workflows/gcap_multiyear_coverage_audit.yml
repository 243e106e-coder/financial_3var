name: GCAP multiyear coverage audit

on:
  workflow_dispatch:
  push:
    paths:
      - "R/23_gcap_multiyear_coverage_audit.R"
      - "data/GCAP_financial_W_2017.csv"
      - ".github/workflows/gcap_multiyear_coverage_audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::haven
            any::readxl

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f "R/23_gcap_multiyear_coverage_audit.R" \
            || { echo "::error::Missing R/23_gcap_multiyear_coverage_audit.R"; exit 1; }

          test -f "data/GCAP_financial_W_2017.csv" \
            || { echo "::error::Missing data/GCAP_financial_W_2017.csv"; exit 1; }

      - name: Run GCAP multiyear coverage audit
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/23_gcap_multiyear_coverage_audit.R

      - name: Show coverage decision
        if: always()
        shell: bash
        run: |
          echo "=== GCAP COVERAGE README ==="
          cat results/gcap_coverage/README_gcap_coverage.txt || true

          echo
          echo "=== COMMON YEARS ==="
          cat results/gcap_coverage/02_common_years.csv || true

          echo
          echo "=== 2017 REBUILD COMPARISON ==="
          cat results/gcap_coverage/05_2017_rebuild_comparison.csv || true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcap-multiyear-coverage-${{ github.run_id }}
          path: |
            results/gcap_coverage/
            data/GCAP_financial_W_multiyear_average.csv
          if-no-files-found: warn
          retention-days: 30
