name: Financial 3var TVP-GVAR smoke test

on:
  workflow_dispatch:
    inputs:
      draws:
        description: "FFBS posterior draws for the smoke test"
        required: false
        default: "60"
      state_scale:
        description: "Random-walk TVP innovation scale"
        required: false
        default: "0.00001"
      min_stable_share:
        description: "Minimum posterior draw-quarter share with global spectral radius < 1"
        required: false
        default: "0.90"
  push:
    paths:
      - "R/00_config.R"
      - "R/10_build_financial_3var_input.R"
      - "R/20_weight_preflight.R"
      - "R/30_stability_grid.R"
      - "R/40_estimation_gate.R"
      - "R/50_tvp_gvar_smoke_test.R"
      - "data/weights/**"
      - ".github/workflows/03_tvp_gvar_smoke_test.yml"

jobs:
  tvp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TVP_SMOKE_DRAWS: ${{ github.event.inputs.draws || '60' }}
      TVP_STATE_SCALE: ${{ github.event.inputs.state_scale || '0.00001' }}
      TVP_MIN_STABLE_SHARE: ${{ github.event.inputs.min_stable_share || '0.90' }}
      TVP_SMOKE_SEED: "20260901"
      TVP_PRIOR_SCALE: "4"
      TVP_RIDGE: "0.00000001"
      TVP_MIN_G0_RCOND: "0.0000000001"
      TVP_MAX_SPLIT_DIFF: "0.10"
      TVP_MAX_ABS_STD_BETA: "50"

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Fetch validated macro inputs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/243e106e-coder/tvp-gvar-replication-private.git source_repo
          git -C source_repo sparse-checkout set 8.12

          test -f "source_repo/8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx" \
            || { echo "::error::Missing macro workbook"; exit 1; }
          test -f "source_repo/8.12/gpr_quarterly_processed.csv" \
            || { echo "::error::Missing GPR file"; exit 1; }
          test -f "source_repo/8.12/IMF_Brent_quarterly_log_2000Q1_2026Q2.csv" \
            || { echo "::error::Missing Brent file"; exit 1; }

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install input dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl

      - name: Build clean financial 3-variable panel
        run: Rscript --vanilla R/10_build_financial_3var_input.R

      - name: Validate financial weights
        run: Rscript --vanilla R/20_weight_preflight.R

      - name: Reconfirm p1 q1 global stability
        run: Rscript --vanilla R/30_stability_grid.R

      - name: Reconfirm estimation gate
        run: Rscript --vanilla R/40_estimation_gate.R

      - name: Run Bayesian TVP-GVAR smoke test
        run: Rscript --vanilla R/50_tvp_gvar_smoke_test.R

      - name: Show smoke-test gate
        if: always()
        shell: bash
        run: |
          echo "=== PRE-ESTIMATION GATE ==="
          cat results/gate/ESTIMATION_GATE.txt || true
          echo
          echo "=== TVP SMOKE TEST ==="
          cat results/tvp_smoke/README_tvp_smoke.txt || true
          echo
          echo "=== WORST QUARTERS BY POSTERIOR STABILITY ==="
          if [ -f results/tvp_smoke/01_posterior_stability_by_quarter.csv ]; then
            Rscript --vanilla -e 'd<-read.csv("results/tvp_smoke/01_posterior_stability_by_quarter.csv"); d<-d[order(d$StableShare,-d$RhoP95),]; print(utils::head(d,15),row.names=FALSE)'
          fi

      - name: Upload TVP smoke-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-tvp-smoke-${{ github.run_id }}
          path: |
            data/derived/
            results/weights/
            results/stability/
            results/gate/
            results/tvp_smoke/
          if-no-files-found: warn
          retention-days: 30
