name: Financial 3var 10 trade-W end-to-end Delta-r TVP-GVAR

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Trade network to estimate"
        required: true
        default: "trade_2000_2012"
        type: choice
        options:
          - trade_2000_2012
          - trade_2000_2014_mirror
      burn_per_chain:
        description: "Burn-in iterations per country-chain"
        required: true
        default: "5000"
        type: string
      postburn_per_chain:
        description: "Post-burn MCMC iterations per country-chain"
        required: true
        default: "10000"
        type: string
      stored_per_chain:
        description: "Strictly post-burn draws stored per country-chain"
        required: true
        default: "2000"
        type: string
      seed_base:
        description: "Base seed; same first-pass value as accepted financial 08j"
        required: true
        default: "20260920"
        type: string
      diagnostic_draws_per_chain:
        description: "Draws per chain for dynamic-stability diagnosis"
        required: true
        default: "250"
        type: string
      diagnostic_cores:
        description: "Cores for dynamic-stability diagnostic"
        required: true
        default: "2"
        type: string
      irf_horizon:
        description: "GPR IRF horizon in quarters"
        required: true
        default: "12"
        type: string
      gpr_shock_pct:
        description: "Positive GPR shock in percent"
        required: true
        default: "10"
        type: string
      irf_cores:
        description: "Parallel IRF event-anchor workers"
        required: true
        default: "2"
        type: string
      max_parallel:
        description: "Maximum simultaneous country-chain jobs"
        required: true
        default: "14"
        type: string
      financial_reference_08m_run_id:
        description: "Accepted GCAP financial-W 08m IRF run used only for final comparison"
        required: true
        default: "33814426556"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FIN3_NETWORK: ${{ inputs.network }}
      FIN3_TRADE_SOURCE_ROOT: source_repo/8.12

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Verify end-to-end scripts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "R/00_config.R"
            "R/21_prepare_trade_weight_candidates.R"
            "R/10_build_financial_3var_input.R"
            "R/15_variable_transformation_audit.R"
            "R/53_event_calendar.R"
            "R/54_build_tvp_irf_targets.R"
            "R/60_formal_bayesian_tvp_gvar.R"
            "R/61_formal_mcmc_diagnostics.R"
            "R/63_posterior_dynamic_stability_source_diagnostic.R"
            "R/65_rate_diff_formal_decision.R"
            "R/67_formal_rate_diff_gpr_tvp_irf.R"
            "R/55_irf_significance_audit.R"
            "R/56_irf_plot_diagnostic.R"
            "R/72_compare_trade_vs_financial_irf.R"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Fetch validated source inputs and legacy trade sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source_repo
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/243e106e-coder/tvp-gvar-replication-private.git source_repo
          git -C source_repo sparse-checkout set 8.12

          required=(
            "source_repo/8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx"
            "source_repo/8.12/gpr_quarterly_processed.csv"
            "source_repo/8.12/IMF_Brent_quarterly_log_2000Q1_2026Q2.csv"
            "source_repo/8.12/Trade_Weights_14_Economies_2000_2014.csv"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "::error::Missing source input $f"; exit 1; }
          done

          ls source_repo/8.12/Trade_Weights_14_Economies_2000_2012*.xlsx >/dev/null 2>&1 || {
            echo "::error::Missing 2000-2012 trade-weight workbook."
            exit 1
          }

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install prepare dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::urca

      - name: Rebuild and audit trade-weight candidates
        shell: bash
        run: |
          set -euo pipefail
          # The trade file is created by R21; R00 registers it in later R sessions.
          Rscript --vanilla R/21_prepare_trade_weight_candidates.R

      - name: Enforce trade-weight source gate
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            g <- read.csv("results/trade_weight_audit/00_trade_weight_gate.csv",
                          stringsAsFactors=FALSE, check.names=FALSE)
            if (nrow(g)!=1L || g$Status[1]!="READY_FOR_TRADE_2000_2012_MODEL") {
              print(g); stop("Trade weight audit failed.")
            }
            source("R/00_config.R")
            if (!(MAIN_NETWORK %in% names(WEIGHT_FILES))) {
              stop("Selected network was not registered after R21: ", MAIN_NETWORK)
            }
            W <- read_weight_matrix(network_path(MAIN_NETWORK), normalize=FALSE)
            if (max(abs(rowSums(W)-1))>1e-8 || max(abs(diag(W)))>1e-8) {
              stop("Selected trade matrix failed final integrity check.")
            }
            cat("TRADE NETWORK SELECTED:", MAIN_NETWORK, "\n")
            cat("ROLE:", network_role(MAIN_NETWORK), "\n")
          '

      - name: Build baseline panel
        run: Rscript --vanilla R/10_build_financial_3var_input.R

      - name: Build Delta-r panel and all-network static stability comparison
        run: Rscript --vanilla R/15_variable_transformation_audit.R

      - name: Build event calendar and IRF target grid
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/53_event_calendar.R
          Rscript --vanilla R/54_build_tvp_irf_targets.R

      - name: Enforce selected trade network pre-estimation gate
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            source("R/00_config.R")
            tg <- read.csv("results/variable_transform/11_transformation_integrity_gate.csv",
                           stringsAsFactors=FALSE, check.names=FALSE)
            if (!all(tg$Pass)) { print(tg); stop("Transformation gate failed.") }

            cmp <- read.csv("results/variable_transform/09_same_sample_rate_spec_comparison.csv",
                            stringsAsFactors=FALSE, check.names=FALSE)
            z <- cmp[cmp$Network==MAIN_NETWORK,,drop=FALSE]
            if (nrow(z)!=1L) stop("Missing selected-network static comparison.")

            lr <- as.numeric(z$GlobalSpectralRadius_RateLevel[1])
            dr <- as.numeric(z$GlobalSpectralRadius_RateDiff[1])
            cat(sprintf("Selected network: %s\n", MAIN_NETWORK))
            cat(sprintf("Rate-level rho: %.8f\n", lr))
            cat(sprintf("Delta-r rho: %.8f\n", dr))
            if (!is.finite(dr) || dr>=1) stop("Selected trade-W Delta-r static GVAR is unstable.")

            p <- "data/derived/panel_domestic_fin3_rate_diff.csv"
            if (!file.exists(p)) stop("Delta-r panel missing.")
            cat("TRADE-W PRE-ESTIMATION GATE: PASS\n")
          '

      - name: Upload prepared trade-W inputs
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10-trade-input-${{ inputs.network }}-${{ github.run_id }}
          path: |
            data/derived/
            data/weights/W_trade_2000_2012.csv
            data/weights/W_trade_2000_2014_mirror.csv
            data/weights/trade_weight_lineage.csv
            results/trade_weight_audit/
            results/variable_transform/
            results/events/
          if-no-files-found: error
          retention-days: 30

  estimate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        country: [AU, BR, CA, CH, CN, EA, UK, JP, KR, NO, SG, TR, US, ZA]
        chain: [1, 2, 3, 4]

    env:
      FIN3_NETWORK: ${{ inputs.network }}
      FIN3_COUNTRY: ${{ matrix.country }}
      FIN3_CHAIN_ID: ${{ matrix.chain }}
      FIN3_BURN: ${{ inputs.burn_per_chain }}
      FIN3_KEEP: ${{ inputs.postburn_per_chain }}
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_SEED_BASE: ${{ inputs.seed_base }}
      FIN3_TTVP_B1: "2"
      FIN3_TTVP_B2: "1"
      FIN3_TTVP_KAPPA0: "1e-4"
      FIN3_SV_ON: "true"
      FIN3_TVS_ON: "true"
      FIN3_FORMAL_PANEL: data/derived/panel_domestic_fin3_rate_diff.csv

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Download prepared trade-W inputs
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-${{ inputs.network }}-${{ github.run_id }}
          path: .

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install formal TVP dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::RcppArmadillo
            any::stochvol
            any::GIGrvg
            any::MASS
            any::dlm
            any::snowfall

      - name: Install pinned threshtvp
        shell: bash
        run: |
          set -euo pipefail
          THRESHTVP_SHA="c0133f262fcf0f935805168f8b7def02b43dc6d5"
          rm -rf threshtvp_src
          git clone https://github.com/gregorkastner/threshtvp.git threshtvp_src
          git -C threshtvp_src checkout --detach "${THRESHTVP_SHA}"
          test "$(git -C threshtvp_src rev-parse HEAD)" = "${THRESHTVP_SHA}"
          find threshtvp_src/src -maxdepth 1 -type f \
            \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -delete
          R CMD INSTALL --preclean --clean --no-multiarch --with-keep.source threshtvp_src
          Rscript --vanilla -e 'stopifnot(requireNamespace("threshtvp", quietly=TRUE))'

      - name: Run selected trade-W Delta-r country-chain TVP MCMC
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            source("R/00_config.R")
            cat("NETWORK=", MAIN_NETWORK, "\n")
            cat("ROLE=", network_role(MAIN_NETWORK), "\n")
            if (!grepl("^trade_", MAIN_NETWORK)) stop("This workflow is trade-W only.")
            if (!file.exists(network_path(MAIN_NETWORK))) stop("Selected trade W missing.")
          '
          Rscript --vanilla R/60_formal_bayesian_tvp_gvar.R

      - name: Verify posterior lineage
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            fs <- list.files(file.path("results","formal_tvp_parts",
                 Sys.getenv("FIN3_COUNTRY"),paste0("chain_",Sys.getenv("FIN3_CHAIN_ID"))),
                 pattern="^formal_tvp_[A-Z]{2}_chain[0-9]+[.]rds$",full.names=TRUE)
            if (length(fs)!=1L) stop("Expected one posterior RDS.")
            z <- readRDS(fs)
            if (basename(z$meta$source_panel)!="panel_domestic_fin3_rate_diff.csv") stop("Not Delta-r.")
            if (as.character(z$meta$main_network)!=Sys.getenv("FIN3_NETWORK")) stop("Network lineage mismatch.")
            if (as.integer(z$meta$stored_draws)!=as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN"))) stop("Stored mismatch.")
            cat("TRADE-W POSTERIOR LINEAGE: PASS\n")
          '

      - name: Upload selected trade-W posterior part
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10-trade-part-${{ inputs.network }}-${{ matrix.country }}-chain${{ matrix.chain }}-${{ github.run_id }}
          path: results/formal_tvp_parts/${{ matrix.country }}/chain_${{ matrix.chain }}/
          if-no-files-found: error
          retention-days: 30

  diagnose:
    needs: [prepare, estimate]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      FIN3_NETWORK: ${{ inputs.network }}
      FIN3_PARTS_ROOT: posterior_parts
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_RHAT_TARGET: "1.01"
      FIN3_RHAT_HARD: "1.05"
      FIN3_ESS_TARGET: "400"
      FIN3_ESS_HARD: "100"
      FIN3_MIN_RHAT_TARGET_SHARE: "0.95"
      FIN3_MIN_ESS_TARGET_SHARE: "0.90"

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Download prepared trade-W inputs
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-${{ inputs.network }}-${{ github.run_id }}
          path: .

      - name: Download all selected trade-W posterior parts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10-trade-part-${{ inputs.network }}-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install convergence dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::posterior

      - name: Verify exact 56-part selected-network grid
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            source("R/00_config.R")
            fs <- list.files("posterior_parts",
              pattern="^formal_tvp_[A-Z]{2}_chain[0-9]+[.]rds$",
              recursive=TRUE,full.names=TRUE)
            if (length(fs)!=56L) stop("Expected 56 posterior parts; found ",length(fs))
            ix <- do.call(rbind,lapply(fs,function(f){
              z<-readRDS(f)
              data.frame(Country=z$meta$country,Chain=z$meta$chain,
                         Network=z$meta$main_network,Panel=basename(z$meta$source_panel))
            }))
            key <- paste(ix$Country,ix$Chain,sep="||")
            exp <- paste(rep(COUNTRIES,each=4L),rep(1:4,times=length(COUNTRIES)),sep="||")
            if (anyDuplicated(key)||!setequal(key,exp)) stop("Country-chain grid mismatch.")
            if (any(ix$Network!=MAIN_NETWORK)) stop("Mixed network posterior grid.")
            if (any(ix$Panel!="panel_domestic_fin3_rate_diff.csv")) stop("Mixed panel grid.")
            cat("TRADE-W 56-PART GRID: PASS\n")
          '

      - name: Run four-chain MCMC diagnostics
        run: Rscript --vanilla R/61_formal_mcmc_diagnostics.R

      - name: Show MCMC gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f results/formal_tvp/00_formal_mcmc_gate.csv && cat results/formal_tvp/00_formal_mcmc_gate.csv || true

      - name: Upload trade-W convergence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10-trade-convergence-${{ inputs.network }}-${{ github.run_id }}
          path: results/formal_tvp/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce MCMC gate
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            g<-read.csv("results/formal_tvp/00_formal_mcmc_gate.csv",stringsAsFactors=FALSE)
            if(nrow(g)!=1L||g$Status[1]!="READY_FOR_FORMAL_IRF"){
              print(g); stop("Trade-W MCMC convergence gate failed. Do not run IRF until rescued.")
            }
            cat("TRADE-W MCMC: READY_FOR_FORMAL_IRF\n")
          '

  dynamic_stability:
    needs: [prepare, estimate, diagnose]
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      FIN3_NETWORK: ${{ inputs.network }}
      FIN3_PARTS_ROOT: posterior_parts
      FIN3_CONVERGENCE_DIR: results/formal_tvp
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_DIAG_DRAWS_PER_CHAIN: ${{ inputs.diagnostic_draws_per_chain }}
      FIN3_DIAG_CORES: ${{ inputs.diagnostic_cores }}
      FIN3_IRF_MIN_G0_RCOND: "1e-10"
      FIN3_LOO_COUNTRIES: "ZA,JP,BR,US,SG"
      FIN3_RATE_DIFF_MIN_ANCHOR_STABLE: "0.90"

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Download prepared trade-W inputs
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-${{ inputs.network }}-${{ github.run_id }}
          path: .

      - name: Download all trade-W posterior parts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10-trade-part-${{ inputs.network }}-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: true

      - name: Download convergence gate
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-convergence-${{ inputs.network }}-${{ github.run_id }}
          path: .

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Diagnose posterior global dynamic stability
        run: Rscript --vanilla R/63_posterior_dynamic_stability_source_diagnostic.R

      - name: Run formal Delta-r decision gate
        run: Rscript --vanilla R/65_rate_diff_formal_decision.R

      - name: Enforce selected trade-W stability decision
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            g<-read.csv("results/rate_diff_decision/00_rate_diff_formal_gate.csv",
                        stringsAsFactors=FALSE)
            if(nrow(g)!=1L||g$Status[1]!="RATE_DIFF_READY_FOR_IRF_RECODE"){
              print(g); stop("Trade-W Delta-r specification failed final stability decision.")
            }
            cat("TRADE-W STABILITY: RATE_DIFF_READY_FOR_IRF_RECODE\n")
          '

      - name: Upload selected trade-W stability decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10-trade-stability-${{ inputs.network }}-${{ github.run_id }}
          path: |
            results/dynamic_stability_source/
            results/rate_diff_decision/
          if-no-files-found: error
          retention-days: 30

  irf:
    needs: [prepare, estimate, diagnose, dynamic_stability]
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      FIN3_NETWORK: ${{ inputs.network }}
      FIN3_PARTS_ROOT: posterior_parts
      FIN3_CONVERGENCE_DIR: results/formal_tvp
      FIN3_RATE_DIFF_DECISION_DIR: results/rate_diff_decision
      FIN3_RATE_DIFF_PANEL_BASENAME: panel_domestic_fin3_rate_diff.csv
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_IRF_HORIZON: ${{ inputs.irf_horizon }}
      FIN3_GPR_SHOCK_PCT: ${{ inputs.gpr_shock_pct }}
      FIN3_IRF_MIN_STABLE_SHARE: "0.90"
      FIN3_IRF_MIN_G0_RCOND: "1e-10"
      FIN3_IRF_CORES: ${{ inputs.irf_cores }}
      FIN3_RATE_MODE: difference
      FIN3_EQ_RETURN_MODE: simple_return
      FIN3_REQUIRE_TRANSFORM_AUDIT: "true"
      FIN3_IRF_SUMMARY: results/formal_irf_rate_diff/irf_posterior_summary.csv

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Download prepared trade-W inputs
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-${{ inputs.network }}-${{ github.run_id }}
          path: .

      - name: Download all trade-W posterior parts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10-trade-part-${{ inputs.network }}-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: true

      - name: Download convergence gate
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-convergence-${{ inputs.network }}-${{ github.run_id }}
          path: .

      - name: Download stability decision
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-stability-${{ inputs.network }}-${{ github.run_id }}
          path: .

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install IRF audit and plotting dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2

      - name: Verify exact selected-network lineage before IRF
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            source("R/00_config.R")
            fs<-list.files("posterior_parts",
              pattern="^formal_tvp_[A-Z]{2}_chain[0-9]+[.]rds$",
              recursive=TRUE,full.names=TRUE)
            if(length(fs)!=56L) stop("Expected 56 posterior parts.")
            nets<-vapply(fs,function(f) as.character(readRDS(f)$meta$main_network),"")
            if(any(nets!=MAIN_NETWORK)) stop("IRF posterior lineage mixes networks.")
            cat("TRADE-W IRF LINEAGE:",MAIN_NETWORK,"\n")
          '

      - name: Run full-posterior Delta-r GPR IRF
        run: Rscript --vanilla R/67_formal_rate_diff_gpr_tvp_irf.R

      - name: Enforce formal IRF gate
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            g<-read.csv("results/formal_irf_rate_diff/00_formal_rate_diff_irf_gate.csv",
                        stringsAsFactors=FALSE)
            if(nrow(g)!=1L||g$Status[1]!="READY_FOR_RATE_DIFF_IRF_AUDIT"){
              print(g); stop("Trade-W formal IRF gate failed.")
            }
            if(g$MainNetwork[1]!=Sys.getenv("FIN3_NETWORK")) stop("IRF gate network mismatch.")
            if(g$WorstAnchorStableShare[1]<0.90) stop("IRF posterior stability below 90%.")
            cat("TRADE-W FORMAL IRF: READY_FOR_AUDIT\n")
          '

      - name: Run transformation-aware IRF audit and plots
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/55_irf_significance_audit.R
          Rscript --vanilla R/56_irf_plot_diagnostic.R

      - name: Enforce R55 audit integrity
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            g<-read.csv("results/irf_audit/05_irf_audit_integrity_gate.csv",
                        stringsAsFactors=FALSE)
            if(!all(g$Pass)){ print(g); stop("Trade-W R55 audit failed.") }
            cat("TRADE-W R55 AUDIT: PASS\n")
          '

      - name: Upload selected trade-W formal IRF
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10-trade-irf-${{ inputs.network }}-${{ github.run_id }}
          path: |
            results/formal_irf_rate_diff/
            results/irf_audit/
          if-no-files-found: error
          retention-days: 30

  compare_to_financial:
    needs: irf
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FIN3_TRADE_IRF_ROOT: trade_irf/formal_irf_rate_diff
      FIN3_FINANCIAL_IRF_ROOT: financial_ref/formal_irf_rate_diff
      FIN3_NETWORK_COMPARE_OUT: results/network_comparison

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Download this run trade-W IRF
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-irf-${{ inputs.network }}-${{ github.run_id }}
          path: trade_irf

      - name: Download accepted GCAP financial-W 08m reference
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-08m-formal-rate-diff-irf-${{ inputs.financial_reference_08m_run_id }}
          path: financial_ref
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.financial_reference_08m_run_id }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Compare trade-W and accepted financial-W IRFs
        run: Rscript --vanilla R/72_compare_trade_vs_financial_irf.R

      - name: Show comparison
        shell: bash
        run: |
          set -euo pipefail
          cat results/network_comparison/00_network_comparison_gate.csv
          echo
          cat results/network_comparison/01_core_safe_haven_direction_comparison.csv
          echo
          cat results/network_comparison/02_tr_raw_reer_h1_comparison.csv

      - name: Upload network comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10-trade-vs-financial-${{ inputs.network }}-${{ github.run_id }}
          path: results/network_comparison/
          if-no-files-found: error
          retention-days: 30
