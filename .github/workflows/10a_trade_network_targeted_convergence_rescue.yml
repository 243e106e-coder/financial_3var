name: Financial 3var 10a Trade-W targeted convergence rescue

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Source Trade-W run containing original 56 posterior parts"
        required: true
        default: "34056102906"
        type: string

      source_ref:
        description: "Exact head SHA of source Trade-W run"
        required: true
        default: "710aea67d12ed8b38bdc2e275e27448241653299"
        type: string

      rescue_burn_per_chain:
        description: "Extended burn-in for rescue chains"
        required: true
        default: "7500"
        type: string

      rescue_postburn_per_chain:
        description: "Extended post-burn internal iterations"
        required: true
        default: "20000"
        type: string

      stored_per_chain:
        description: "Strictly post-burn stored draws per chain"
        required: true
        default: "2000"
        type: string

      seed_base:
        description: "NEW seed base; intentionally different from source run"
        required: true
        default: "20261273"
        type: string

      max_parallel:
        description: "Maximum simultaneous rescue chain jobs"
        required: true
        default: "12"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify_source:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_REF: ${{ inputs.source_ref }}
      NETWORK: "trade_2000_2012"

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Verify source run identity
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${SOURCE_REF}" || {
            echo "::error::Checked-out SHA does not equal source_ref."
            exit 1
          }

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"

          STATUS="$(jq -r '.status' <<<"${RUN_JSON}")"
          HEAD_SHA="$(jq -r '.head_sha' <<<"${RUN_JSON}")"
          WORKFLOW_PATH="$(jq -r '.path' <<<"${RUN_JSON}")"

          echo "status=${STATUS}"
          echo "head_sha=${HEAD_SHA}"
          echo "workflow=${WORKFLOW_PATH}"

          test "${STATUS}" = "completed" || {
            echo "::error::Source run is not completed."
            exit 1
          }

          test "${HEAD_SHA}" = "${SOURCE_REF}" || {
            echo "::error::Source run SHA mismatch."
            exit 1
          }

          test "${WORKFLOW_PATH}" = ".github/workflows/10_trade_network_end_to_end.yml" || {
            echo "::error::Unexpected source workflow."
            exit 1
          }

      - name: Verify required estimation scripts
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "R/00_config.R"
            "R/60_formal_bayesian_tvp_gvar.R"
            "R/61_formal_mcmc_diagnostics.R"
          )

          for f in "${required[@]}"; do
            test -f "${f}" || {
              echo "::error::Missing ${f}"
              exit 1
            }
          done

      - name: Verify source artifacts
        shell: bash
        run: |
          set -euo pipefail

          ART_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"

          PARTS="$(
            jq -r \
              --arg rid "${SOURCE_RUN_ID}" \
              '[.artifacts[]
                | select(
                    .expired == false
                    and (.name | startswith("financial-3var-10-trade-part-trade_2000_2012-"))
                    and (.name | endswith("-" + $rid))
                  )
               ] | length' \
              <<<"${ART_JSON}"
          )"

          INPUT_NAME="financial-3var-10-trade-input-trade_2000_2012-${SOURCE_RUN_ID}"

          INPUTS="$(
            jq -r \
              --arg name "${INPUT_NAME}" \
              '[.artifacts[]
                | select(.expired == false and .name == $name)
               ] | length' \
              <<<"${ART_JSON}"
          )"

          CONV_NAME="financial-3var-10-trade-convergence-trade_2000_2012-${SOURCE_RUN_ID}"

          CONV="$(
            jq -r \
              --arg name "${CONV_NAME}" \
              '[.artifacts[]
                | select(.expired == false and .name == $name)
               ] | length' \
              <<<"${ART_JSON}"
          )"

          echo "posterior parts = ${PARTS}"
          echo "input artifacts  = ${INPUTS}"
          echo "convergence      = ${CONV}"

          test "${PARTS}" = "56" || {
            echo "::error::Expected 56 original posterior parts."
            exit 1
          }

          test "${INPUTS}" = "1" || {
            echo "::error::Expected exactly one source input artifact."
            exit 1
          }

          test "${CONV}" = "1" || {
            echo "::error::Expected source convergence artifact."
            exit 1
          }

          echo "10A SOURCE INTEGRITY: PASS"

  rescue:
    needs: verify_source
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        country: [BR, CH, CN, UK, KR, NO, SG, TR, ZA]
        chain: [1, 2, 3, 4]

    env:
      FIN3_NETWORK: "trade_2000_2012"
      FIN3_COUNTRY: ${{ matrix.country }}
      FIN3_CHAIN_ID: ${{ matrix.chain }}
      FIN3_BURN: ${{ inputs.rescue_burn_per_chain }}
      FIN3_KEEP: ${{ inputs.rescue_postburn_per_chain }}
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_SEED_BASE: ${{ inputs.seed_base }}
      FIN3_TTVP_B1: "2"
      FIN3_TTVP_B2: "1"
      FIN3_TTVP_KAPPA0: "1e-4"
      FIN3_SV_ON: "true"
      FIN3_TVS_ON: "true"
      FIN3_FORMAL_PANEL: "data/derived/panel_domestic_fin3_rate_diff.csv"

    steps:
      - name: Checkout exact source-model commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Download exact source Trade-W input
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-trade_2000_2012-${{ inputs.source_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify rescue contract
        shell: bash
        run: |
          set -euo pipefail

          test -f data/derived/panel_domestic_fin3_rate_diff.csv || {
            echo "::error::Delta-r panel missing."
            exit 1
          }

          test -f data/weights/W_trade_2000_2012.csv || {
            echo "::error::Trade-W matrix missing."
            exit 1
          }

          test -f results/events/00_event_calendar.csv || {
            echo "::error::Event calendar missing."
            exit 1
          }

          test "${FIN3_NETWORK}" = "trade_2000_2012" || exit 1
          test "${FIN3_STORED_PER_CHAIN}" = "2000" || exit 1
          test "${FIN3_TTVP_KAPPA0}" = "1e-4" || exit 1

          echo "============================================"
          echo "TRADE-W TARGETED RESCUE"
          echo "country     = ${FIN3_COUNTRY}"
          echo "chain       = ${FIN3_CHAIN_ID}"
          echo "network     = ${FIN3_NETWORK}"
          echo "burn        = ${FIN3_BURN}"
          echo "post-burn   = ${FIN3_KEEP}"
          echo "stored      = ${FIN3_STORED_PER_CHAIN}"
          echo "seed base   = ${FIN3_SEED_BASE}"
          echo "============================================"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install formal TVP dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::RcppArmadillo
            any::stochvol
            any::GIGrvg
            any::MASS
            any::dlm
            any::snowfall

      - name: Install pinned threshtvp
        shell: bash
        run: |
          set -euo pipefail

          THRESHTVP_SHA="c0133f262fcf0f935805168f8b7def02b43dc6d5"

          rm -rf threshtvp_src
          git clone https://github.com/gregorkastner/threshtvp.git threshtvp_src
          git -C threshtvp_src checkout --detach "${THRESHTVP_SHA}"

          test "$(git -C threshtvp_src rev-parse HEAD)" = "${THRESHTVP_SHA}"

          find threshtvp_src/src \
            -maxdepth 1 \
            -type f \
            \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) \
            -delete

          R CMD INSTALL \
            --preclean \
            --clean \
            --no-multiarch \
            --with-keep.source \
            threshtvp_src

          Rscript --vanilla -e 'stopifnot(requireNamespace("threshtvp", quietly=TRUE))'

      - name: Run extended Trade-W rescue MCMC
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla -e '
            source("R/00_config.R")

            cat("MAIN_NETWORK =", MAIN_NETWORK, "\n")

            if (MAIN_NETWORK != "trade_2000_2012") {
              stop("Unexpected network: ", MAIN_NETWORK)
            }

            if (!file.exists(network_path(MAIN_NETWORK))) {
              stop("Selected trade W missing.")
            }
          '

          Rscript --vanilla R/60_formal_bayesian_tvp_gvar.R

      - name: Validate rescued posterior metadata
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla -e '
            cc <- Sys.getenv("FIN3_COUNTRY")
            ch <- as.integer(Sys.getenv("FIN3_CHAIN_ID"))

            expected_burn <- as.integer(Sys.getenv("FIN3_BURN"))
            expected_keep <- as.integer(Sys.getenv("FIN3_KEEP"))
            expected_stored <- as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN"))

            f <- list.files(
              file.path("results", "formal_tvp_parts", cc, paste0("chain_", ch)),
              pattern = paste0("^formal_tvp_", cc, "_chain", ch, "[.]rds$"),
              recursive = TRUE,
              full.names = TRUE
            )

            if (length(f) != 1L) {
              stop("Expected exactly one rescued posterior; found ", length(f))
            }

            z <- readRDS(f)

            stopifnot(as.character(z$meta$country) == cc)
            stopifnot(as.integer(z$meta$chain) == ch)
            stopifnot(as.integer(z$meta$stored_draws) == expected_stored)
            stopifnot(as.integer(z$meta$burn) == expected_burn)
            stopifnot(as.integer(z$meta$keep_internal) == expected_keep)
            stopifnot(
              basename(as.character(z$meta$source_panel)) ==
                "panel_domestic_fin3_rate_diff.csv"
            )
            stopifnot(as.character(z$meta$main_network) == "trade_2000_2012")

            cat("10A RESCUED POSTERIOR METADATA: PASS\n")
          '

      - name: Upload rescued posterior
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10a-trade-rescue-trade_2000_2012-${{ matrix.country }}-chain${{ matrix.chain }}-${{ github.run_id }}
          path: results/formal_tvp_parts/${{ matrix.country }}/chain_${{ matrix.chain }}/
          if-no-files-found: error
          retention-days: 30

  diagnose:
    needs: [verify_source, rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      FIN3_NETWORK: "trade_2000_2012"
      FIN3_PARTS_ROOT: "posterior_parts"
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_RHAT_TARGET: "1.01"
      FIN3_RHAT_HARD: "1.05"
      FIN3_ESS_TARGET: "400"
      FIN3_ESS_HARD: "100"
      FIN3_MIN_RHAT_TARGET_SHARE: "0.95"
      FIN3_MIN_ESS_TARGET_SHARE: "0.90"
      RESCUE_BURN: ${{ inputs.rescue_burn_per_chain }}
      RESCUE_KEEP: ${{ inputs.rescue_postburn_per_chain }}

    steps:
      - name: Checkout exact source-model commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install convergence dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::posterior

      - name: Download all original Trade-W posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10-trade-part-trade_2000_2012-*-${{ inputs.source_run_id }}
          path: posterior_parts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Remove superseded original chains
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          RESCUE_COUNTRIES=(BR CH CN UK KR NO SG TR ZA)

          for cc in "${RESCUE_COUNTRIES[@]}"; do
            dirs=(
              posterior_parts/financial-3var-10-trade-part-trade_2000_2012-${cc}-chain*-${SOURCE_RUN_ID}
            )

            if [ "${#dirs[@]}" -ne 4 ]; then
              echo "::error::Expected 4 original dirs for ${cc}; found ${#dirs[@]}"
              exit 1
            fi

            rm -rf "${dirs[@]}"
          done

      - name: Download rescued Trade-W posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10a-trade-rescue-trade_2000_2012-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: false

      - name: Verify exact 20 retained plus 36 rescued grid
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla -e '
            source("R/00_config.R")

            targets <- c("BR","CH","CN","UK","KR","NO","SG","TR","ZA")
            retained_expected <- c("AU","CA","EA","JP","US")

            rescue_burn <- as.integer(Sys.getenv("RESCUE_BURN"))
            rescue_keep <- as.integer(Sys.getenv("RESCUE_KEEP"))
            stored_expected <- as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN"))

            fs <- list.files(
              "posterior_parts",
              pattern = "^formal_tvp_[A-Z]{2}_chain[0-9]+[.]rds$",
              recursive = TRUE,
              full.names = TRUE
            )

            if (length(fs) != 56L) {
              stop("Expected exactly 56 posterior files; found ", length(fs))
            }

            ix <- do.call(
              rbind,
              lapply(fs, function(f) {
                z <- readRDS(f)
                data.frame(
                  Country = as.character(z$meta$country),
                  Chain = as.integer(z$meta$chain),
                  Burn = as.integer(z$meta$burn),
                  Keep = as.integer(z$meta$keep_internal),
                  Stored = as.integer(z$meta$stored_draws),
                  Panel = basename(as.character(z$meta$source_panel)),
                  Network = as.character(z$meta$main_network),
                  File = f,
                  stringsAsFactors = FALSE
                )
              })
            )

            key <- paste(ix$Country, ix$Chain, sep="||")
            expected <- paste(
              rep(COUNTRIES, each=4),
              rep(1:4, times=length(COUNTRIES)),
              sep="||"
            )

            if (anyDuplicated(key) || !setequal(key, expected)) {
              stop("Country-chain grid mismatch.")
            }

            if (any(ix$Stored != stored_expected)) {
              stop("Stored draw count mismatch.")
            }

            if (any(ix$Panel != "panel_domestic_fin3_rate_diff.csv")) {
              stop("Non-Delta-r posterior detected.")
            }

            if (any(ix$Network != "trade_2000_2012")) {
              stop("Non-Trade-W posterior detected.")
            }

            rescued <- ix[ix$Country %in% targets, , drop=FALSE]
            retained <- ix[ix$Country %in% retained_expected, , drop=FALSE]

            if (nrow(rescued) != 36L) {
              stop("Expected 36 rescued chains; found ", nrow(rescued))
            }

            if (nrow(retained) != 20L) {
              stop("Expected 20 retained chains; found ", nrow(retained))
            }

            if (any(rescued$Burn != rescue_burn)) {
              stop("Rescue burn length mismatch.")
            }

            if (any(rescued$Keep != rescue_keep)) {
              stop("Rescue post-burn length mismatch.")
            }

            if (any(retained$Burn != 5000L)) {
              stop("Retained source burn mismatch.")
            }

            if (any(retained$Keep != 10000L)) {
              stop("Retained source post-burn mismatch.")
            }

            dir.create(
              "results/10a_trade_rescue_audit",
              recursive=TRUE,
              showWarnings=FALSE
            )

            ix <- ix[order(ix$Country, ix$Chain), , drop=FALSE]

            write.csv(
              ix,
              "results/10a_trade_rescue_audit/00_mixed_posterior_index.csv",
              row.names=FALSE
            )

            cat("10A MIXED POSTERIOR GRID: PASS\n")
          '

      - name: Run formal MCMC convergence diagnostics
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/61_formal_mcmc_diagnostics.R

      - name: Show convergence results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "================ MCMC GATE ================"
          cat results/formal_tvp/00_formal_mcmc_gate.csv || true

          echo
          echo "============= COUNTRY SUMMARY ============="
          cat results/formal_tvp/02_mcmc_country_summary.csv || true

      - name: Upload Trade-W rescue convergence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10a-trade-convergence-trade_2000_2012-${{ github.run_id }}
          path: |
            results/formal_tvp/
            results/10a_trade_rescue_audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce rescued Trade-W convergence gate
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla -e '
            g <- read.csv(
              "results/formal_tvp/00_formal_mcmc_gate.csv",
              stringsAsFactors = FALSE,
              check.names = FALSE
            )

            print(g)

            if (nrow(g) != 1L || g$Status[1] != "READY_FOR_FORMAL_IRF") {
              stop(
                "Trade-W targeted rescue still fails MCMC convergence. Do NOT run IRF."
              )
            }

            cat("TRADE-W TARGETED RESCUE: PASS\n")
            cat("MCMC STATUS: READY_FOR_FORMAL_IRF\n")
          '
