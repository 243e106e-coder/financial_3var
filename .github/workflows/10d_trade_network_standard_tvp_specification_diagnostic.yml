name: Financial 3var 10d Trade-W standard-TVP specification diagnostic

on:
  workflow_dispatch:
    inputs:
      original_run_id:
        description: "Original Trade-W run containing exact input artifact"
        required: true
        default: "34056102906"
        type: string
      model_ref:
        description: "Exact statistical-model code SHA"
        required: true
        default: "710aea67d12ed8b38bdc2e275e27448241653299"
        type: string
      burn_per_chain:
        description: "Outer MCMC burn-in"
        required: true
        default: "12500"
        type: string
      postburn_per_chain:
        description: "Outer post-burn iterations"
        required: true
        default: "50000"
        type: string
      stored_per_chain:
        description: "Strictly post-burn stored draws"
        required: true
        default: "2000"
        type: string
      sv_inner_burnin:
        description: "Extra internal stochvol transitions; same as 10c"
        required: true
        default: "4"
        type: string
      seed_base:
        description: "Fresh independent seed base"
        required: true
        default: "20263173"
        type: string
      max_parallel:
        description: "Maximum simultaneous jobs"
        required: true
        default: "8"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        country: [CN, SG]
        chain: [1, 2, 3, 4]

    env:
      FIN3_NETWORK: "trade_2000_2012"
      FIN3_COUNTRY: ${{ matrix.country }}
      FIN3_CHAIN_ID: ${{ matrix.chain }}
      FIN3_BURN: ${{ inputs.burn_per_chain }}
      FIN3_KEEP: ${{ inputs.postburn_per_chain }}
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_SEED_BASE: ${{ inputs.seed_base }}
      FIN3_SV_INNER_BURNIN: ${{ inputs.sv_inner_burnin }}
      FIN3_TTVP_B1: "2"
      FIN3_TTVP_B2: "1"
      FIN3_TTVP_KAPPA0: "1e-4"
      FIN3_SV_ON: "true"
      FIN3_TVS_ON: "false"
      FIN3_FORMAL_PANEL: "data/derived/panel_domestic_fin3_rate_diff.csv"

    steps:
      - name: Checkout exact model code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.model_ref }}

      - name: Download exact original Trade-W input
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-trade_2000_2012-${{ inputs.original_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.original_run_id }}

      - name: Verify diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          test -f data/derived/panel_domestic_fin3_rate_diff.csv
          test -f data/weights/W_trade_2000_2012.csv
          test -f results/events/00_event_calendar.csv
          case "${FIN3_COUNTRY}" in CN|SG) ;; *) exit 1 ;; esac
          test "${FIN3_NETWORK}" = "trade_2000_2012"
          test "${FIN3_SV_ON}" = "true"
          test "${FIN3_TVS_ON}" = "false"
          test "${FIN3_TTVP_B1}" = "2"
          test "${FIN3_TTVP_B2}" = "1"
          test "${FIN3_TTVP_KAPPA0}" = "1e-4"
          echo "10D CONTRACT: same data/W/prior/SV/kappa as 10c; only TVS TRUE -> FALSE."

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install formal TVP dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::RcppArmadillo
            any::stochvol
            any::GIGrvg
            any::MASS
            any::dlm
            any::snowfall

      - name: Install pinned threshtvp with same SV inner mixing as 10c
        shell: bash
        run: |
          set -euo pipefail
          THRESHTVP_SHA="c0133f262fcf0f935805168f8b7def02b43dc6d5"
          rm -rf threshtvp_src
          git clone https://github.com/gregorkastner/threshtvp.git threshtvp_src
          git -C threshtvp_src checkout --detach "${THRESHTVP_SHA}"
          test "$(git -C threshtvp_src rev-parse HEAD)" = "${THRESHTVP_SHA}"
          find threshtvp_src/src -maxdepth 1 -type f \
            \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -delete

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path("threshtvp_src/R/MCMC_function.R")
          s = p.read_text(encoding="utf-8")
          inner = int(os.environ["FIN3_SV_INNER_BURNIN"])
          old = "draws=1, burnin=0"
          new = f"draws=1, burnin={inner}"

          start = s.find("MCMC_tvp <- function")
          end = s.find("VAR_posterior <- function", start)
          if start < 0 or end < 0:
              raise SystemExit("Cannot isolate MCMC_tvp() block.")
          prefix, block, suffix = s[:start], s[start:end], s[end:]
          if block.count(old) != 1:
              raise SystemExit(
                  f"Expected one SV call inside MCMC_tvp; found {block.count(old)}"
              )
          patched = prefix + block.replace(old, new, 1) + suffix
          p.write_text(patched, encoding="utf-8")
          print("Patched MCMC_tvp SV transition:", old, "->", new)
          PY

          R CMD INSTALL --preclean --clean --no-multiarch --with-keep.source threshtvp_src

      - name: Run standard-TVP diagnostic MCMC
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/60_formal_bayesian_tvp_gvar.R

      - name: Validate model metadata
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla - <<'RS'
          cc <- Sys.getenv("FIN3_COUNTRY")
          ch <- as.integer(Sys.getenv("FIN3_CHAIN_ID"))
          root <- file.path("results","formal_tvp_parts",cc,paste0("chain_",ch))
          f <- list.files(root, pattern="[.]rds$", full.names=TRUE)
          if (length(f) != 1L) stop("Expected one posterior RDS.")
          z <- readRDS(f)
          stopifnot(as.character(z$meta$country) == cc)
          stopifnot(as.integer(z$meta$chain) == ch)
          stopifnot(isTRUE(z$meta$sv_on))
          stopifnot(!isTRUE(z$meta$tvs_on))
          stopifnot(as.character(z$meta$main_network) == "trade_2000_2012")
          stopifnot(basename(as.character(z$meta$source_panel)) == "panel_domestic_fin3_rate_diff.csv")
          stopifnot(abs(as.numeric(z$meta$prior_B1)-2) < 1e-12)
          stopifnot(abs(as.numeric(z$meta$prior_B2)-1) < 1e-12)
          stopifnot(abs(as.numeric(z$meta$kappa0)-1e-4) < 1e-12)
          cat("10D POSTERIOR CONTRACT: PASS\n")
          RS

      - name: Upload diagnostic posterior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10d-standard-tvp-${{ matrix.country }}-chain${{ matrix.chain }}-${{ github.run_id }}
          path: results/formal_tvp_parts/${{ matrix.country }}/chain_${{ matrix.chain }}/
          if-no-files-found: warn
          retention-days: 30

  diagnose:
    needs: estimate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_RHAT_TARGET: "1.01"
      FIN3_RHAT_HARD: "1.05"
      FIN3_ESS_TARGET: "400"
      FIN3_ESS_HARD: "100"

    steps:
      - name: Download all 8 diagnostic posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10d-standard-tvp-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install posterior diagnostics
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::posterior

      - name: Run two-country formal convergence diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/10d_standard_tvp_diagnostic

          Rscript --vanilla - <<'RS'
          if (!requireNamespace("posterior", quietly=TRUE)) stop("posterior missing")

          ROOT <- "posterior_parts"
          OUT <- "results/10d_standard_tvp_diagnostic"
          countries <- c("CN","SG")
          nchains <- 4L
          expected_draws <- as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN"))
          rhat_target <- as.numeric(Sys.getenv("FIN3_RHAT_TARGET"))
          rhat_hard <- as.numeric(Sys.getenv("FIN3_RHAT_HARD"))
          ess_target <- as.numeric(Sys.getenv("FIN3_ESS_TARGET"))
          ess_hard <- as.numeric(Sys.getenv("FIN3_ESS_HARD"))

          files <- list.files(ROOT, pattern="^formal_tvp_[A-Z]{2}_chain[1-4][.]rds$",
                              recursive=TRUE, full.names=TRUE)
          if (length(files) != 8L) stop("Expected 8 posterior RDS files; found ", length(files))

          index <- do.call(rbind, lapply(files, function(f) {
            z <- readRDS(f)
            data.frame(
              Country=as.character(z$meta$country),
              Chain=as.integer(z$meta$chain),
              Stored=as.integer(z$meta$stored_draws),
              Burn=as.integer(z$meta$burn),
              Keep=as.integer(z$meta$keep_internal),
              SV=isTRUE(z$meta$sv_on),
              TVS=isTRUE(z$meta$tvs_on),
              Kappa0=as.numeric(z$meta$kappa0),
              File=f,
              stringsAsFactors=FALSE
            )
          }))
          index <- index[order(index$Country,index$Chain),]
          write.csv(index,file.path(OUT,"00_parts_index.csv"),row.names=FALSE)

          expected <- expand.grid(Country=countries,Chain=1:4,stringsAsFactors=FALSE)
          key <- function(x) paste(x$Country,x$Chain,sep="||")
          if (!setequal(key(index),key(expected))) stop("Country-chain grid mismatch.")
          if (any(index$Stored != expected_draws)) stop("Stored draw mismatch.")
          if (!all(index$SV) || any(index$TVS)) stop("SV/TVS contract mismatch.")
          if (any(abs(index$Kappa0-1e-4)>1e-12)) stop("kappa mismatch.")

          param_rows <- list(); pr <- 0L
          chain_rows <- list(); cr <- 0L

          for (cc in countries) {
            chains <- lapply(1:4, function(ch) {
              f <- index$File[index$Country==cc & index$Chain==ch]
              z <- readRDS(f)
              m <- as.matrix(z$monitor)
              if (nrow(m) != expected_draws) stop("Monitor draw mismatch.")
              m
            })
            pars <- colnames(chains[[1]])
            if (!all(vapply(chains,function(x) identical(colnames(x),pars),logical(1)))) {
              stop("Monitor columns differ across chains.")
            }

            for (j in seq_along(pars)) {
              mat <- do.call(cbind,lapply(chains,function(x) x[,j]))
              finite <- all(is.finite(mat))
              constant <- finite && all(apply(mat,2,sd) < 1e-12)
              if (finite && !constant) {
                rh <- posterior::rhat(mat)
                eb <- posterior::ess_bulk(mat)
                et <- posterior::ess_tail(mat)
              } else {
                rh <- eb <- et <- NA_real_
              }
              pr <- pr+1L
              param_rows[[pr]] <- data.frame(
                Country=cc,Parameter=pars[j],Finite=finite,Constant=constant,
                Rhat=rh,ESS_Bulk=eb,ESS_Tail=et,
                PassRhatHard=is.finite(rh) && rh<=rhat_hard,
                PassBulkHard=is.finite(eb) && eb>=ess_hard,
                PassTailHard=is.finite(et) && et>=ess_hard,
                stringsAsFactors=FALSE
              )
              for (ch in 1:4) {
                vals <- mat[,ch]
                cr <- cr+1L
                chain_rows[[cr]] <- data.frame(
                  Country=cc,Parameter=pars[j],Chain=ch,
                  Mean=mean(vals),SD=sd(vals),
                  Q05=unname(quantile(vals,.05)),
                  Q50=unname(quantile(vals,.50)),
                  Q95=unname(quantile(vals,.95)),
                  stringsAsFactors=FALSE
                )
              }
            }
          }

          diag <- do.call(rbind,param_rows)
          chain <- do.call(rbind,chain_rows)
          write.csv(diag,file.path(OUT,"01_parameter_diagnostics.csv"),row.names=FALSE)
          write.csv(chain,file.path(OUT,"02_chain_parameter_summary.csv"),row.names=FALSE)

          active <- diag[diag$Finite & !diag$Constant & is.finite(diag$Rhat) &
                         is.finite(diag$ESS_Bulk) & is.finite(diag$ESS_Tail),]
          summary <- do.call(rbind,lapply(countries,function(cc) {
            x <- active[active$Country==cc,]
            data.frame(
              Country=cc,
              ActiveDiagnostics=nrow(x),
              MaxRhat=max(x$Rhat),
              RhatTargetShare=mean(x$Rhat<=rhat_target),
              RhatHardShare=mean(x$Rhat<=rhat_hard),
              MinESSBulk=min(x$ESS_Bulk),
              MinESSTail=min(x$ESS_Tail),
              ESSBulkTargetShare=mean(x$ESS_Bulk>=ess_target),
              ESSTailTargetShare=mean(x$ESS_Tail>=ess_target),
              HardFailCount=sum(x$Rhat>rhat_hard | x$ESS_Bulk<ess_hard | x$ESS_Tail<ess_hard),
              stringsAsFactors=FALSE
            )
          }))
          write.csv(summary,file.path(OUT,"03_country_summary.csv"),row.names=FALSE)

          hard <- active[active$Rhat>rhat_hard | active$ESS_Bulk<ess_hard | active$ESS_Tail<ess_hard,]
          write.csv(hard,file.path(OUT,"04_hard_fail_parameters.csv"),row.names=FALSE)

          overall <- data.frame(
            Spec="STANDARD_TVP__SV_TRUE__TVS_FALSE",
            Countries=2,
            ChainsPerCountry=4,
            MaxRhat=max(active$Rhat),
            MinESSBulk=min(active$ESS_Bulk),
            MinESSTail=min(active$ESS_Tail),
            HardFailParameters=nrow(hard),
            DiagnosticPass=(nrow(hard)==0),
            stringsAsFactors=FALSE
          )
          write.csv(overall,file.path(OUT,"05_overall_diagnostic.csv"),row.names=FALSE)

          cat("\n===== 10D COUNTRY SUMMARY =====\n")
          print(summary)
          cat("\n===== 10D HARD FAIL PARAMETERS =====\n")
          print(hard[,c("Country","Parameter","Rhat","ESS_Bulk","ESS_Tail")])
          cat("\n===== 10D OVERALL =====\n")
          print(overall)
          cat("\nDIAGNOSTIC ONLY: do not run IRF from this two-country specification.\n")
          RS

      - name: Upload 10d specification diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10d-standard-tvp-diagnostic-${{ github.run_id }}
          path: results/10d_standard_tvp_diagnostic/
          if-no-files-found: warn
          retention-days: 30
