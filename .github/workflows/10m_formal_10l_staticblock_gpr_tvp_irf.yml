name: Financial 3var 10m Trade-W formal 10l GPR TVP-GVAR IRF

on:
  workflow_dispatch:
    inputs:
      source_10l_run_id:
        description: "Accepted 10l formal-validation run"
        required: true
        default: "34107218673"
        type: string
      source_10l_head_sha:
        description: "Exact accepted 10l workflow head SHA"
        required: true
        default: "670d9f05bbc59321cb3687110578d0cba374b9f7"
        type: string
      source_input_run_id:
        description: "Original Trade-W run containing exact prepared input artifact"
        required: true
        default: "34056102906"
        type: string
      horizon:
        description: "Formal IRF horizon in quarters"
        required: true
        default: "12"
        type: string
      gpr_shock_pct:
        description: "Positive one-time GPR shock in percent"
        required: true
        default: "10"
        type: string
      irf_cores:
        description: "Parallel event-anchor workers"
        required: true
        default: "2"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  formal_irf:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ github.token }}
      RUN10L: ${{ inputs.source_10l_run_id }}
      SOURCE10L_SHA: ${{ inputs.source_10l_head_sha }}
      INPUT_RUN: ${{ inputs.source_input_run_id }}

      FIN3_NETWORK: "trade_2000_2012"
      FIN3_PARTS_ROOT: "posterior_parts"
      FIN3_CONVERGENCE_DIR: "results/formal_tvp"
      FIN3_10L_AUDIT_DIR: "results/10l_staticblock_sv_audit"
      FIN3_10M_OUT: "results/formal_irf_10m"

      FIN3_FORMAL_PANEL_BASENAME: "panel_domestic_fin3_rate_diff.csv"
      FIN3_EXPECTED_NETWORK: "trade_2000_2012"
      FIN3_NCHAINS: "4"
      FIN3_EXPECTED_BURN: "12500"
      FIN3_EXPECTED_KEEP: "50000"
      FIN3_STORED_PER_CHAIN: "2000"
      FIN3_EXPECTED_SV_INNER_BURNIN: "4"

      FIN3_IRF_HORIZON: ${{ inputs.horizon }}
      FIN3_GPR_SHOCK_PCT: ${{ inputs.gpr_shock_pct }}
      FIN3_IRF_MIN_G0_RCOND: "1e-10"
      FIN3_IRF_MIN_STABLE_SHARE: "0.90"
      FIN3_IRF_MIN_VALID_SHARE: "0.90"
      FIN3_IRF_MIN_G0_OK_SHARE: "0.99"
      FIN3_IRF_MIN_FINITE_RHO_SHARE: "0.99"
      FIN3_IRF_CORES: ${{ inputs.irf_cores }}

      FIN3_IRF_SUMMARY: "results/formal_irf_10m/01_irf_posterior_summary.csv"
      FIN3_RATE_MODE: "difference"
      FIN3_EQ_RETURN_MODE: "simple_return"
      FIN3_REQUIRE_TRANSFORM_AUDIT: "true"

    steps:
      - name: Checkout current formal IRF code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted 10l source run, artifacts and unchanged formal core
        shell: bash
        run: |
          set -euo pipefail

          test -f R/68_formal_10l_staticblock_gpr_tvp_irf.R || {
            echo "::error::Missing R/68_formal_10l_staticblock_gpr_tvp_irf.R"
            exit 1
          }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN10L}")"
          test "$(jq -r '.status' <<<"${run_json}")" = "completed" || {
            echo "::error::10l source run is not completed."
            exit 1
          }
          test "$(jq -r '.conclusion' <<<"${run_json}")" = "success" || {
            echo "::error::10l source run did not conclude success."
            exit 1
          }
          test "$(jq -r '.head_sha' <<<"${run_json}")" = "${SOURCE10L_SHA}" || {
            echo "::error::10l head SHA mismatch."
            exit 1
          }
          test "$(jq -r '.path' <<<"${run_json}")" = \
            ".github/workflows/10l_trade_network_14country_staticblock_sv_formal_validation.yml" || {
            echo "::error::Unexpected 10l workflow path."
            exit 1
          }

          input_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_RUN}")"
          test "$(jq -r '.status' <<<"${input_json}")" = "completed" || {
            echo "::error::Original Trade-W input run is not completed."
            exit 1
          }
          test "$(jq -r '.path' <<<"${input_json}")" = \
            ".github/workflows/10_trade_network_end_to_end.yml" || {
            echo "::error::Unexpected Trade-W input workflow path."
            exit 1
          }

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN10L}/artifacts?per_page=100")"

          final_name="financial-3var-10l-staticblock-sv-formal-validation-trade_2000_2012-${RUN10L}"
          final_count="$(
            jq --arg n "${final_name}" \
              '[.artifacts[] | select(.expired == false and .name == $n)] | length' \
              <<<"${artifact_json}"
          )"
          test "${final_count}" = "1" || {
            echo "::error::Expected exactly one unexpired 10l final-validation artifact; found ${final_count}."
            exit 1
          }

          part_count="$(
            jq --arg p "financial-3var-10l-staticblock-sv-trade_2000_2012-" \
               --arg s "-${RUN10L}" \
              '[.artifacts[] |
                select(
                  .expired == false and
                  (.name | startswith($p)) and
                  (.name | endswith($s))
                )
              ] | length' \
              <<<"${artifact_json}"
          )"
          test "${part_count}" = "56" || {
            echo "::error::Expected 56 unexpired 10l posterior artifacts; found ${part_count}."
            exit 1
          }

          input_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_RUN}/artifacts?per_page=100")"
          input_name="financial-3var-10-trade-input-trade_2000_2012-${INPUT_RUN}"
          input_count="$(
            jq --arg n "${input_name}" \
              '[.artifacts[] | select(.expired == false and .name == $n)] | length' \
              <<<"${input_artifact_json}"
          )"
          test "${input_count}" = "1" || {
            echo "::error::Expected exactly one unexpired exact Trade-W input artifact; found ${input_count}."
            exit 1
          }

          # The accepted model/audit core must not silently change after 10l.
          git cat-file -e "${SOURCE10L_SHA}^{commit}"
          git diff --exit-code "${SOURCE10L_SHA}" -- \
            R/00_config.R \
            R/55_irf_significance_audit.R \
            R/56_irf_plot_diagnostic.R || {
              echo "::error::Formal config/audit core differs from accepted 10l source SHA."
              exit 1
            }

          echo "10M SOURCE RUN + ARTIFACT + CORE LINEAGE: PASS"

      - name: Download exact original Trade-W prepared inputs
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-trade_2000_2012-${{ inputs.source_input_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_input_run_id }}

      - name: Download all 56 accepted 10l posterior parts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf posterior_parts
          mkdir -p posterior_parts

          gh run download "${RUN10L}" \
            --pattern "financial-3var-10l-staticblock-sv-trade_2000_2012-*-${RUN10L}" \
            --dir posterior_parts

          n="$(
            find posterior_parts -type f \
              -name 'formal_tvp_*_chain*.rds' \
              | wc -l | tr -d ' '
          )"
          test "${n}" = "56" || {
            echo "::error::Expected 56 downloaded posterior RDS files; found ${n}."
            exit 1
          }

          echo "10M 56 POSTERIOR PARTS DOWNLOADED: PASS"

      - name: Download accepted 10l final gate artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf accepted_10l

          gh run download "${RUN10L}" \
            --name "financial-3var-10l-staticblock-sv-formal-validation-trade_2000_2012-${RUN10L}" \
            --dir accepted_10l

          FORMAL_GATE="$(find accepted_10l -type f -name '00_formal_mcmc_gate.csv' -print -quit)"
          FINAL_GATE="$(find accepted_10l -type f -name '07_final_10l_gate.csv' -print -quit)"

          test -n "${FORMAL_GATE}" || {
            echo "::error::Accepted formal MCMC gate not found in 10l artifact."
            exit 1
          }
          test -n "${FINAL_GATE}" || {
            echo "::error::Accepted final 10l gate not found in 10l artifact."
            exit 1
          }

          rm -rf results/formal_tvp results/10l_staticblock_sv_audit
          mkdir -p results/formal_tvp results/10l_staticblock_sv_audit
          cp -a "$(dirname "${FORMAL_GATE}")/." results/formal_tvp/
          cp -a "$(dirname "${FINAL_GATE}")/." results/10l_staticblock_sv_audit/

          echo "=== ACCEPTED FORMAL MCMC GATE ==="
          cat results/formal_tvp/00_formal_mcmc_gate.csv
          echo
          echo "=== ACCEPTED FINAL 10L GATE ==="
          cat results/10l_staticblock_sv_audit/07_final_10l_gate.csv
          echo

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install IRF audit and plotting dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2

      - name: Parse formal 10m R script
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e 'parse(file="R/68_formal_10l_staticblock_gpr_tvp_irf.R"); cat("10M R SCRIPT PARSE: PASS\n")'

      - name: Preflight exact 10l posterior and transformation contracts
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          source("R/00_config.R")

          if (MAIN_NETWORK != "trade_2000_2012") {
            stop("10m must run on trade_2000_2012.")
          }

          w <- network_path(MAIN_NETWORK)
          if (!file.exists(w)) stop("Exact accepted Trade-W matrix missing: ", w)
          W <- read_weight_matrix(w, normalize = FALSE)
          if (max(abs(rowSums(W) - 1)) > 1e-8) stop("Trade-W row sums are not one.")
          if (max(abs(diag(W))) > 1e-8) stop("Trade-W diagonal is not zero.")

          tf <- "results/variable_transform/11_transformation_integrity_gate.csv"
          if (!file.exists(tf)) stop("Transformation integrity gate missing.")
          tg <- read.csv(tf, stringsAsFactors = FALSE, check.names = FALSE)
          if (!all(tg$Pass)) {
            print(tg)
            stop("Transformation integrity gate is not all PASS.")
          }

          fg <- read.csv(
            "results/formal_tvp/00_formal_mcmc_gate.csv",
            stringsAsFactors = FALSE,
            check.names = FALSE
          )
          lg <- read.csv(
            "results/10l_staticblock_sv_audit/07_final_10l_gate.csv",
            stringsAsFactors = FALSE,
            check.names = FALSE
          )
          if (nrow(fg) != 1L || fg$Status[1] != "READY_FOR_FORMAL_IRF") {
            stop("Formal MCMC prerequisite is not READY_FOR_FORMAL_IRF.")
          }
          if (nrow(lg) != 1L || lg$FinalStatus[1] != "READY_FOR_FORMAL_IRF") {
            stop("Final 10l prerequisite is not READY_FOR_FORMAL_IRF.")
          }

          fs <- list.files(
            "posterior_parts",
            pattern = "^formal_tvp_[A-Z]{2}_chain[1-4][.]rds$",
            recursive = TRUE,
            full.names = TRUE
          )
          if (length(fs) != 56L) stop("Expected 56 posterior RDS files; found ", length(fs))

          idx <- do.call(rbind, lapply(fs, function(f) {
            z <- readRDS(f)
            data.frame(
              Country = as.character(z$meta$country),
              Chain = as.integer(z$meta$chain),
              Stored = as.integer(z$meta$stored_draws),
              Burn = as.integer(z$meta$burn),
              Keep = as.integer(z$meta$keep_internal),
              Panel = basename(as.character(z$meta$source_panel)),
              Network = as.character(z$meta$main_network),
              Restriction = as.character(z$meta$restriction_id),
              StaticTerms = paste(as.character(z$meta$static_terms), collapse = ";"),
              SV = isTRUE(z$meta$sv_on),
              TVS = isTRUE(z$meta$tvs_on),
              SVInnerBurnin = as.integer(z$meta$sv_inner_burnin),
              stringsAsFactors = FALSE
            )
          }))

          expected <- paste(
            rep(COUNTRIES, each = 4L),
            rep(1:4, times = length(COUNTRIES)),
            sep = "||"
          )
          got <- paste(idx$Country, idx$Chain, sep = "||")

          if (anyDuplicated(got) || !setequal(got, expected)) stop("14 x 4 posterior grid mismatch.")
          if (any(idx$Stored != 2000L)) stop("Stored draws mismatch.")
          if (any(idx$Burn != 12500L)) stop("Burn mismatch.")
          if (any(idx$Keep != 50000L)) stop("Internal keep mismatch.")
          if (any(idx$Panel != "panel_domestic_fin3_rate_diff.csv")) stop("Panel mismatch.")
          if (any(idx$Network != "trade_2000_2012")) stop("Network mismatch.")
          if (any(idx$Restriction != "STATIC_BLOCK_ALL_CONTEMPORANEOUS_FOREIGN_STAR")) {
            stop("10l static-block restriction mismatch.")
          }
          if (any(idx$StaticTerms != "r_star_0;de_star_0;deq_star_0")) {
            stop("10l static-term set mismatch.")
          }
          if (any(!idx$SV) || any(!idx$TVS)) stop("SV/TVS mismatch.")
          if (any(idx$SVInnerBurnin != 4L)) stop("SV inner burn-in mismatch.")

          cat("10M EXACT 10L POSTERIOR + TRANSFORMATION PREFLIGHT: PASS\n")
          RS

      - name: Run formal 10m full-posterior GPR IRF
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/68_formal_10l_staticblock_gpr_tvp_irf.R

      - name: Enforce formal 10m IRF integrity gate
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          f <- "results/formal_irf_10m/00_formal_10m_irf_gate.csv"
          if (!file.exists(f)) stop("10m IRF gate file missing.")
          g <- read.csv(f, stringsAsFactors = FALSE, check.names = FALSE)
          if (nrow(g) != 1L) stop("Malformed 10m IRF gate.")

          print(g)

          if (g$SourcePosteriorGate[1] != "READY_FOR_FORMAL_IRF") {
            stop("10m did not use a formally accepted 10l posterior.")
          }
          if (g$PosteriorFiles[1] != 56L) stop("10m posterior file count mismatch.")
          if (g$StaticPosteriorReauditFailures[1] != 0L) {
            stop("10m static-block posterior re-audit has failures.")
          }
          if (g$Status[1] != "READY_FOR_FORMAL_10M_IRF_AUDIT") {
            stop("Formal 10m IRF integrity gate failed. Do not interpret IRFs.")
          }

          cat("10M FORMAL GPR IRF: READY_FOR_AUDIT\n")
          RS

      - name: Run transformation-aware IRF significance audit
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/55_irf_significance_audit.R

      - name: Enforce IRF significance-audit numeric integrity
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          f <- "results/irf_audit/05_irf_audit_integrity_gate.csv"
          if (!file.exists(f)) stop("R55 audit integrity gate missing.")
          g <- read.csv(f, stringsAsFactors = FALSE, check.names = FALSE)
          if (!all(g$Pass)) {
            print(g)
            stop("R55 transformation-aware IRF audit integrity gate failed.")
          }

          s <- read.csv(
            "results/irf_audit/00a_irf_variable_scale_manifest.csv",
            stringsAsFactors = FALSE,
            check.names = FALSE
          )
          r <- s[s$ResponseVariable == "r", , drop = FALSE]
          if (nrow(r) != 1L || r$RuntimeMode[1] != "difference") {
            stop("R55 did not run in Delta-r mode.")
          }

          cat("10M R55 TRANSFORMATION-AWARE IRF AUDIT: PASS\n")
          RS

      - name: Generate audited diagnostic IRF figures
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/56_irf_plot_diagnostic.R

      - name: Show final 10m gates and compact safe-haven inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================ 10M FORMAL IRF GATE ================"
          cat results/formal_irf_10m/00_formal_10m_irf_gate.csv || true
          echo
          echo "================ 10M IDENTIFICATION =================="
          cat results/formal_irf_10m/12_identification_manifest.csv || true
          echo
          echo "================ R55 NUMERIC INTEGRITY ==============="
          cat results/irf_audit/05_irf_audit_integrity_gate.csv || true
          echo
          echo "================ SAFE-HAVEN INPUT SAMPLE ============="
          head -n 25 results/formal_irf_10m/10_safe_haven_reer_inputs.csv || true
          echo

      - name: Upload formal 10m IRF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10m-formal-10l-gpr-irf-${{ github.run_id }}
          path: |
            results/formal_irf_10m/
            results/irf_audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Final enforcement after artifact upload
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          f <- "results/formal_irf_10m/00_formal_10m_irf_gate.csv"
          if (!file.exists(f)) {
            stop("Final 10m gate missing after upload. Do not use IRFs.")
          }
          g <- read.csv(f, stringsAsFactors = FALSE, check.names = FALSE)
          if (nrow(g) != 1L || g$Status[1] != "READY_FOR_FORMAL_10M_IRF_AUDIT") {
            stop("10m did not pass its formal IRF gate. Do not use IRFs.")
          }

          af <- "results/irf_audit/05_irf_audit_integrity_gate.csv"
          if (!file.exists(af)) stop("R55 integrity gate missing after upload.")
          a <- read.csv(af, stringsAsFactors = FALSE, check.names = FALSE)
          if (!all(a$Pass)) stop("R55 numeric integrity gate did not pass.")

          cat("\n=====================================================\n")
          cat("10M FORMAL 10L GPR TVP-GVAR IRF: READY_FOR_INTERPRETATION\n")
          cat("=====================================================\n")
          RS
