name: Financial 3var 10e CN long-chain convergence rescue

on:
  workflow_dispatch:
    inputs:
      original_run_id:
        description: "Original Trade-W run containing exact input artifact"
        required: true
        default: "34056102906"
        type: string

      model_ref:
        description: "Exact statistical-model code SHA"
        required: true
        default: "710aea67d12ed8b38bdc2e275e27448241653299"
        type: string

      burn_per_chain:
        description: "CN burn-in per chain"
        required: true
        default: "20000"
        type: string

      postburn_per_chain:
        description: "CN internal post-burn iterations per chain"
        required: true
        default: "100000"
        type: string

      stored_per_chain:
        description: "Strictly post-burn stored draws per chain"
        required: true
        default: "4000"
        type: string

      sv_inner_burnin:
        description: "Extra stochvol transitions inside each outer MCMC iteration"
        required: true
        default: "8"
        type: string

      seed_base:
        description: "Fresh independent seed base"
        required: true
        default: "20264017"
        type: string

      max_parallel:
        description: "Maximum simultaneous jobs"
        required: true
        default: "4"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        chain: [1, 2, 3, 4]

    env:
      FIN3_NETWORK: "trade_2000_2012"
      FIN3_COUNTRY: "CN"
      FIN3_CHAIN_ID: ${{ matrix.chain }}

      FIN3_BURN: ${{ inputs.burn_per_chain }}
      FIN3_KEEP: ${{ inputs.postburn_per_chain }}
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_SEED_BASE: ${{ inputs.seed_base }}

      FIN3_SV_INNER_BURNIN: ${{ inputs.sv_inner_burnin }}

      FIN3_TTVP_B1: "2"
      FIN3_TTVP_B2: "1"
      FIN3_TTVP_KAPPA0: "1e-4"
      FIN3_SV_ON: "true"
      FIN3_TVS_ON: "true"

      FIN3_FORMAL_PANEL: "data/derived/panel_domestic_fin3_rate_diff.csv"

    steps:
      - name: Checkout exact model code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.model_ref }}

      - name: Download exact original Trade-W input
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-10-trade-input-trade_2000_2012-${{ inputs.original_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.original_run_id }}

      - name: Verify CN rescue contract
        shell: bash
        run: |
          set -euo pipefail

          test -f data/derived/panel_domestic_fin3_rate_diff.csv
          test -f data/weights/W_trade_2000_2012.csv
          test -f results/events/00_event_calendar.csv

          test "${FIN3_COUNTRY}" = "CN"
          test "${FIN3_NETWORK}" = "trade_2000_2012"
          test "${FIN3_SV_ON}" = "true"
          test "${FIN3_TVS_ON}" = "true"
          test "${FIN3_TTVP_B1}" = "2"
          test "${FIN3_TTVP_B2}" = "1"
          test "${FIN3_TTVP_KAPPA0}" = "1e-4"

          python3 - <<'PY'
          import os
          burn = int(os.environ["FIN3_BURN"])
          keep = int(os.environ["FIN3_KEEP"])
          stored = int(os.environ["FIN3_STORED_PER_CHAIN"])
          inner = int(os.environ["FIN3_SV_INNER_BURNIN"])

          if burn < 10000:
              raise SystemExit("CN long rescue burn must be >= 10000.")
          if keep < 50000:
              raise SystemExit("CN long rescue post-burn must be >= 50000.")
          if stored < 2000:
              raise SystemExit("CN stored draws must be >= 2000.")
          if stored >= keep:
              raise SystemExit("stored_per_chain must be smaller than postburn_per_chain.")
          if inner < 1 or inner > 20:
              raise SystemExit("sv_inner_burnin must be 1..20.")
          PY

          echo "10E CN LONG-CHAIN CONTRACT: PASS"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install formal TVP dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::RcppArmadillo
            any::stochvol
            any::GIGrvg
            any::MASS
            any::dlm
            any::snowfall

      - name: Install pinned threshtvp with stronger SV within-block mixing
        shell: bash
        run: |
          set -euo pipefail

          THRESHTVP_SHA="c0133f262fcf0f935805168f8b7def02b43dc6d5"

          rm -rf threshtvp_src
          git clone https://github.com/gregorkastner/threshtvp.git threshtvp_src
          git -C threshtvp_src checkout --detach "${THRESHTVP_SHA}"
          test "$(git -C threshtvp_src rev-parse HEAD)" = "${THRESHTVP_SHA}"

          find threshtvp_src/src -maxdepth 1 -type f \
            \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) \
            -delete

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path("threshtvp_src/R/MCMC_function.R")
          s = p.read_text(encoding="utf-8")

          inner = int(os.environ["FIN3_SV_INNER_BURNIN"])
          old = "draws=1, burnin=0"
          new = f"draws=1, burnin={inner}"

          start = s.find("MCMC_tvp <- function")
          end = s.find("VAR_posterior <- function", start)

          if start < 0 or end < 0:
              raise SystemExit("Could not isolate MCMC_tvp() block.")

          prefix = s[:start]
          block = s[start:end]
          suffix = s[end:]

          if block.count(old) != 1:
              raise SystemExit(
                  f"Expected exactly one SV call inside MCMC_tvp(); found {block.count(old)}."
              )

          patched = prefix + block.replace(old, new, 1) + suffix

          if patched.count(new) != 1:
              raise SystemExit("Expected exactly one patched MCMC_tvp SV call.")

          p.write_text(patched, encoding="utf-8")
          print("10E SV transition patch:", old, "->", new)
          PY

          R CMD INSTALL \
            --preclean \
            --clean \
            --no-multiarch \
            --with-keep.source \
            threshtvp_src

      - name: Run CN long-chain formal MCMC
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/60_formal_bayesian_tvp_gvar.R

      - name: Validate CN posterior metadata
        shell: bash
        run: |
          set -euo pipefail

          Rscript --vanilla - <<'RS'
          ch <- as.integer(Sys.getenv("FIN3_CHAIN_ID"))
          root <- file.path("results","formal_tvp_parts","CN",paste0("chain_",ch))

          f <- list.files(
            root,
            pattern=paste0("^formal_tvp_CN_chain",ch,"[.]rds$"),
            full.names=TRUE
          )

          if (length(f) != 1L) stop("Expected exactly one CN posterior RDS.")

          z <- readRDS(f)

          stopifnot(as.character(z$meta$country) == "CN")
          stopifnot(as.integer(z$meta$chain) == ch)
          stopifnot(as.integer(z$meta$burn) == as.integer(Sys.getenv("FIN3_BURN")))
          stopifnot(as.integer(z$meta$keep_internal) == as.integer(Sys.getenv("FIN3_KEEP")))
          stopifnot(as.integer(z$meta$stored_draws) == as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN")))
          stopifnot(isTRUE(z$meta$sv_on))
          stopifnot(isTRUE(z$meta$tvs_on))
          stopifnot(as.character(z$meta$main_network) == "trade_2000_2012")
          stopifnot(basename(as.character(z$meta$source_panel)) == "panel_domestic_fin3_rate_diff.csv")
          stopifnot(abs(as.numeric(z$meta$prior_B1)-2) < 1e-12)
          stopifnot(abs(as.numeric(z$meta$prior_B2)-1) < 1e-12)
          stopifnot(abs(as.numeric(z$meta$kappa0)-1e-4) < 1e-12)

          cat("10E CN POSTERIOR METADATA: PASS\n")
          RS

      - name: Upload CN long-chain posterior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10e-cn-long-chain${{ matrix.chain }}-${{ github.run_id }}
          path: results/formal_tvp_parts/CN/chain_${{ matrix.chain }}/
          if-no-files-found: warn
          retention-days: 30

  diagnose:
    needs: estimate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_RHAT_TARGET: "1.01"
      FIN3_RHAT_HARD: "1.05"
      FIN3_ESS_TARGET: "400"
      FIN3_ESS_HARD: "100"

    steps:
      - name: Download four CN long-chain posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-10e-cn-long-chain*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install convergence dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::posterior

      - name: Diagnose CN long-chain convergence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/10e_cn_long_rescue

          Rscript --vanilla - <<'RS'
          if (!requireNamespace("posterior", quietly=TRUE)) stop("posterior missing")

          root <- "posterior_parts"
          out <- "results/10e_cn_long_rescue"
          expected_draws <- as.integer(Sys.getenv("FIN3_STORED_PER_CHAIN"))

          rhat_target <- as.numeric(Sys.getenv("FIN3_RHAT_TARGET"))
          rhat_hard <- as.numeric(Sys.getenv("FIN3_RHAT_HARD"))
          ess_target <- as.numeric(Sys.getenv("FIN3_ESS_TARGET"))
          ess_hard <- as.numeric(Sys.getenv("FIN3_ESS_HARD"))

          files <- list.files(
            root,
            pattern="^formal_tvp_CN_chain[1-4][.]rds$",
            recursive=TRUE,
            full.names=TRUE
          )

          if (length(files) != 4L) {
            stop("Expected 4 CN posterior RDS files; found ", length(files))
          }

          idx <- do.call(rbind,lapply(files,function(f) {
            z <- readRDS(f)
            data.frame(
              Country=as.character(z$meta$country),
              Chain=as.integer(z$meta$chain),
              Burn=as.integer(z$meta$burn),
              Keep=as.integer(z$meta$keep_internal),
              Stored=as.integer(z$meta$stored_draws),
              SV=isTRUE(z$meta$sv_on),
              TVS=isTRUE(z$meta$tvs_on),
              Kappa0=as.numeric(z$meta$kappa0),
              File=f,
              stringsAsFactors=FALSE
            )
          }))

          idx <- idx[order(idx$Chain),]

          if (!identical(idx$Chain,1:4)) stop("CN chain grid mismatch.")
          if (any(idx$Country!="CN")) stop("Unexpected country.")
          if (any(idx$Stored!=expected_draws)) stop("Stored draw mismatch.")
          if (!all(idx$SV) || !all(idx$TVS)) stop("SV/TVS contract mismatch.")
          if (any(abs(idx$Kappa0-1e-4)>1e-12)) stop("kappa mismatch.")

          write.csv(idx,file.path(out,"00_parts_index.csv"),row.names=FALSE)

          chains <- lapply(1:4,function(ch) {
            z <- readRDS(idx$File[idx$Chain==ch])
            m <- as.matrix(z$monitor)
            if (nrow(m)!=expected_draws) stop("Monitor draw mismatch.")
            m
          })

          pars <- colnames(chains[[1]])
          if (!all(vapply(chains,function(x) identical(colnames(x),pars),logical(1)))) {
            stop("Monitor columns differ across chains.")
          }

          rows <- list()
          chain_rows <- list()
          rr <- 0L
          cr <- 0L

          for (j in seq_along(pars)) {
            mat <- do.call(cbind,lapply(chains,function(x)x[,j]))

            finite <- all(is.finite(mat))
            constant <- finite && all(apply(mat,2,sd)<1e-12)

            if (finite && !constant) {
              rh <- posterior::rhat(mat)
              eb <- posterior::ess_bulk(mat)
              et <- posterior::ess_tail(mat)
            } else {
              rh <- eb <- et <- NA_real_
            }

            rr <- rr+1L
            rows[[rr]] <- data.frame(
              Parameter=pars[j],
              Rhat=rh,
              ESS_Bulk=eb,
              ESS_Tail=et,
              PassRhatTarget=is.finite(rh) && rh<=rhat_target,
              PassRhatHard=is.finite(rh) && rh<=rhat_hard,
              PassBulkTarget=is.finite(eb) && eb>=ess_target,
              PassBulkHard=is.finite(eb) && eb>=ess_hard,
              PassTailTarget=is.finite(et) && et>=ess_target,
              PassTailHard=is.finite(et) && et>=ess_hard,
              stringsAsFactors=FALSE
            )

            for (ch in 1:4) {
              vals <- mat[,ch]
              cr <- cr+1L
              chain_rows[[cr]] <- data.frame(
                Parameter=pars[j],
                Chain=ch,
                Mean=mean(vals),
                SD=sd(vals),
                Q05=unname(quantile(vals,.05)),
                Q50=unname(quantile(vals,.50)),
                Q95=unname(quantile(vals,.95)),
                stringsAsFactors=FALSE
              )
            }
          }

          d <- do.call(rbind,rows)
          cs <- do.call(rbind,chain_rows)

          active <- d[
            is.finite(d$Rhat) &
            is.finite(d$ESS_Bulk) &
            is.finite(d$ESS_Tail),
          ]

          hard <- active[
            active$Rhat>rhat_hard |
            active$ESS_Bulk<ess_hard |
            active$ESS_Tail<ess_hard,
          ]

          summary <- data.frame(
            Country="CN",
            Chains=4,
            StoredPerChain=expected_draws,
            MaxRhat=max(active$Rhat),
            RhatTargetShare=mean(active$Rhat<=rhat_target),
            RhatHardShare=mean(active$Rhat<=rhat_hard),
            MinESSBulk=min(active$ESS_Bulk),
            MinESSTail=min(active$ESS_Tail),
            ESSBulkTargetShare=mean(active$ESS_Bulk>=ess_target),
            ESSTailTargetShare=mean(active$ESS_Tail>=ess_target),
            HardFailCount=nrow(hard),
            Status=ifelse(nrow(hard)==0L,"CN_READY","CN_FAIL"),
            stringsAsFactors=FALSE
          )

          write.csv(d,file.path(out,"01_parameter_diagnostics.csv"),row.names=FALSE)
          write.csv(cs,file.path(out,"02_chain_parameter_summary.csv"),row.names=FALSE)
          write.csv(hard,file.path(out,"03_hard_fail_parameters.csv"),row.names=FALSE)
          write.csv(summary,file.path(out,"04_cn_summary.csv"),row.names=FALSE)

          cat("\n===== 10E CN SUMMARY =====\n")
          print(summary)

          cat("\n===== HARD FAIL PARAMETERS =====\n")
          if (nrow(hard)) {
            print(hard[,c("Parameter","Rhat","ESS_Bulk","ESS_Tail")])
          } else {
            cat("NONE\n")
          }

          if (nrow(hard)>0L) {
            stop("10e CN long-chain rescue still fails hard convergence gate.")
          }

          cat("\n10E CN LONG-CHAIN: CN_READY\n")
          RS

      - name: Upload CN convergence diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-10e-cn-convergence-${{ github.run_id }}
          path: results/10e_cn_long_rescue/
          if-no-files-found: warn
          retention-days: 30
