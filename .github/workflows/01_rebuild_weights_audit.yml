name: Rebuild GCAP weights audit

on:
  workflow_dispatch:
  push:
    paths:
      - "R/00_config.R"
      - "R/05_rebuild_weights_from_gcap.R"
      - "data/weights/W_*.csv"
      - ".github/workflows/01_rebuild_weights_audit.yml"

jobs:
  rebuild-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install source-reader dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::haven
            any::readxl

      - name: Rebuild four matrices from published GCAP source
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/05_rebuild_weights_from_gcap.R

      - name: Show audit decision
        if: always()
        shell: bash
        run: |
          cat results/weight_rebuild/README_weight_rebuild.txt || true
          echo
          cat results/weight_rebuild/02_committed_matrix_comparison.csv || true

      - name: Upload rebuild audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcap-weight-rebuild-${{ github.run_id }}
          path: results/weight_rebuild/
          if-no-files-found: warn
          retention-days: 30
