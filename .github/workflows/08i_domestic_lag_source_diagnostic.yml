name: Financial 3var 08i domestic lag source diagnostic

on:
  workflow_dispatch:
    inputs:
      source_08f_run_id:
        description: "08f formal run containing the original 56 posterior parts"
        required: true
        default: "33488003323"
        type: string
      source_08g_run_id:
        description: "Accepted 08g AU-rescue run"
        required: true
        default: "33491313804"
        type: string
      source_08g_ref:
        description: "Expected head SHA of accepted 08g run"
        required: true
        default: "1a50b736b7ed11f583f4495e485599f13bdeb194"
        type: string
      source_08h_run_id:
        description: "Successful 08h diagnostic run used as baseline-integrity reference"
        required: true
        default: "33593822492"
        type: string
      source_08h_ref:
        description: "Expected head SHA of successful 08h run"
        required: true
        default: "98c83def8d13890da12c2df14980625caf5b4a87"
        type: string
      stored_per_chain:
        description: "Must match accepted posterior"
        required: true
        default: "2000"
        type: string
      diagnostic_draws_per_chain:
        description: "Balanced posterior draws per chain; 250 exactly matches 08h"
        required: true
        default: "250"
        type: string
      diagnostic_cores:
        description: "Parallel event-anchor workers"
        required: true
        default: "2"
        type: string
      target_countries:
        description: "Countries for full 3x3 individual domestic-coefficient drilldown"
        required: true
        default: "ZA,BR,JP"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnose_domestic_lag_source:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_08F_RUN_ID: ${{ inputs.source_08f_run_id }}
      SOURCE_08G_RUN_ID: ${{ inputs.source_08g_run_id }}
      SOURCE_08G_REF: ${{ inputs.source_08g_ref }}
      SOURCE_08H_RUN_ID: ${{ inputs.source_08h_run_id }}
      SOURCE_08H_REF: ${{ inputs.source_08h_ref }}
      FIN3_PARTS_ROOT: posterior_parts
      FIN3_CONVERGENCE_DIR: results/formal_tvp
      FIN3_08H_REFERENCE_DIR: reference_08h
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_DIAG_DRAWS_PER_CHAIN: ${{ inputs.diagnostic_draws_per_chain }}
      FIN3_DIAG_CORES: ${{ inputs.diagnostic_cores }}
      FIN3_08I_TARGET_COUNTRIES: ${{ inputs.target_countries }}
      FIN3_IRF_MIN_G0_RCOND: "1e-10"

    steps:
      - name: Checkout repository containing 08i diagnostic
        uses: actions/checkout@v4

      - name: Verify accepted source lineage
        shell: bash
        run: |
          set -euo pipefail

          test "${FIN3_STORED_PER_CHAIN}" = "2000" || {
            echo "::error::08i expects the accepted posterior with stored_per_chain=2000."
            exit 1
          }

          test -f R/64_domestic_lag_source_diagnostic.R || {
            echo "::error::Missing R/64_domestic_lag_source_diagnostic.R"
            exit 1
          }

          RUN8F="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_08F_RUN_ID}")"
          RUN8G="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_08G_RUN_ID}")"
          RUN8H="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_08H_RUN_ID}")"

          STATUS8F="$(jq -r '.status' <<<"${RUN8F}")"
          STATUS8G="$(jq -r '.status' <<<"${RUN8G}")"
          STATUS8H="$(jq -r '.status' <<<"${RUN8H}")"
          CONC8H="$(jq -r '.conclusion' <<<"${RUN8H}")"
          SHA8G="$(jq -r '.head_sha' <<<"${RUN8G}")"
          SHA8H="$(jq -r '.head_sha' <<<"${RUN8H}")"
          PATH8F="$(jq -r '.path' <<<"${RUN8F}")"
          PATH8G="$(jq -r '.path' <<<"${RUN8G}")"
          PATH8H="$(jq -r '.path' <<<"${RUN8H}")"

          echo "08f: status=${STATUS8F} path=${PATH8F}"
          echo "08g: status=${STATUS8G} path=${PATH8G} sha=${SHA8G}"
          echo "08h: status=${STATUS8H} conclusion=${CONC8H} path=${PATH8H} sha=${SHA8H}"

          test "${STATUS8F}" = "completed" || {
            echo "::error::08f source run is not completed."
            exit 1
          }
          test "${STATUS8G}" = "completed" || {
            echo "::error::08g source run is not completed."
            exit 1
          }
          test "${STATUS8H}" = "completed" && test "${CONC8H}" = "success" || {
            echo "::error::08h reference run did not complete successfully."
            exit 1
          }
          test "${SHA8G}" = "${SOURCE_08G_REF}" || {
            echo "::error::08g head SHA mismatch."
            exit 1
          }
          test "${SHA8H}" = "${SOURCE_08H_REF}" || {
            echo "::error::08h head SHA mismatch."
            exit 1
          }

          test "${PATH8F}" = ".github/workflows/08f_formal_bayesian_tvp_gvar_kappa1e4.yml" || {
            echo "::error::source_08f_run_id is not the formal 08f workflow."
            exit 1
          }
          test "${PATH8G}" = ".github/workflows/08g_AU_convergence_rescue_and_formal_irf.yml" || {
            echo "::error::source_08g_run_id is not the accepted 08g workflow."
            exit 1
          }
          test "${PATH8H}" = ".github/workflows/08h_posterior_dynamic_stability_source_diagnostic.yml" || {
            echo "::error::source_08h_run_id is not the accepted 08h workflow."
            exit 1
          }

          A8F="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_08F_RUN_ID}/artifacts?per_page=100")"
          A8G="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_08G_RUN_ID}/artifacts?per_page=100")"
          A8H="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_08H_RUN_ID}/artifacts?per_page=100")"

          N8F="$(jq -r --arg rid "${SOURCE_08F_RUN_ID}" \
            '[.artifacts[] | select(.expired == false and (.name | startswith("financial-3var-formal-kappa1e4-part-")) and (.name | endswith("-" + $rid)))] | length' \
            <<<"${A8F}")"

          NAU="$(jq -r --arg rid "${SOURCE_08G_RUN_ID}" \
            '[.artifacts[] | select(.expired == false and (.name | startswith("financial-3var-08g-AU-part-chain")) and (.name | endswith("-" + $rid)))] | length' \
            <<<"${A8G}")"

          NCONV="$(jq -r --arg name "financial-3var-08g-convergence-${SOURCE_08G_RUN_ID}" \
            '[.artifacts[] | select(.expired == false and .name == $name)] | length' \
            <<<"${A8G}")"

          N08H="$(jq -r --arg name "financial-3var-08h-dynamic-stability-source-${SOURCE_08H_RUN_ID}" \
            '[.artifacts[] | select(.expired == false and .name == $name)] | length' \
            <<<"${A8H}")"

          echo "08f posterior artifacts: ${N8F}"
          echo "08g rescued AU artifacts: ${NAU}"
          echo "08g convergence artifacts: ${NCONV}"
          echo "08h reference artifacts: ${N08H}"

          test "${N8F}" = "56" || exit 1
          test "${NAU}" = "4" || exit 1
          test "${NCONV}" = "1" || exit 1
          test "${N08H}" = "1" || exit 1

          echo "08I SOURCE LINEAGE: PASS"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Download all 56 source 08f posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-formal-kappa1e4-part-*-${{ inputs.source_08f_run_id }}
          path: posterior_parts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08f_run_id }}

      - name: Remove four superseded 08f AU posterior artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          old_au=(posterior_parts/financial-3var-formal-kappa1e4-part-AU-chain*-${SOURCE_08F_RUN_ID})
          test "${#old_au[@]}" -eq 4 || {
            echo "::error::Expected four source AU artifact directories."
            exit 1
          }
          rm -rf "${old_au[@]}"

      - name: Download four accepted 08g AU posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-08g-AU-part-chain*-${{ inputs.source_08g_run_id }}
          path: posterior_parts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08g_run_id }}

      - name: Download accepted 08g convergence artifact
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-08g-convergence-${{ inputs.source_08g_run_id }}
          path: convergence_download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08g_run_id }}

      - name: Download successful 08h reference artifact
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-08h-dynamic-stability-source-${{ inputs.source_08h_run_id }}
          path: reference_08h
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08h_run_id }}

      - name: Normalize and verify accepted posterior grid
        shell: bash
        run: |
          set -euo pipefail

          GATE="$(find convergence_download -type f -name '00_formal_mcmc_gate.csv' -print -quit)"
          test -n "${GATE}" || {
            echo "::error::08g convergence gate not found."
            exit 1
          }

          SRC_DIR="$(dirname "${GATE}")"
          rm -rf results/formal_tvp
          mkdir -p results/formal_tvp
          cp -a "${SRC_DIR}/." results/formal_tvp/

          Rscript --vanilla -e '
            source("R/00_config.R")

            g <- read.csv(
              "results/formal_tvp/00_formal_mcmc_gate.csv",
              stringsAsFactors=FALSE,
              check.names=FALSE
            )
            if (nrow(g) != 1L || g$Status[1] != "READY_FOR_FORMAL_IRF") {
              print(g)
              stop("Accepted 08g convergence artifact is not READY_FOR_FORMAL_IRF.")
            }

            fs <- list.files(
              "posterior_parts",
              pattern="^formal_tvp_[A-Z]{2}_chain[0-9]+[.]rds$",
              recursive=TRUE,
              full.names=TRUE
            )
            if (length(fs) != 56L) {
              stop("Expected exactly 56 posterior RDS files; found ", length(fs))
            }

            ix <- do.call(rbind, lapply(fs, function(f) {
              z <- readRDS(f)
              data.frame(
                Country=z$meta$country,
                Chain=as.integer(z$meta$chain),
                Stored=as.integer(z$meta$stored_draws),
                File=f,
                stringsAsFactors=FALSE
              )
            }))

            key <- paste(ix$Country, ix$Chain, sep="||")
            if (anyDuplicated(key)) stop("Duplicate country-chain posterior part.")
            expected <- paste(
              rep(COUNTRIES, each=4),
              rep(1:4, times=length(COUNTRIES)),
              sep="||"
            )
            missing <- setdiff(expected, key)
            if (length(missing)) stop("Missing posterior parts: ", paste(missing, collapse=", "))
            if (any(ix$Stored != 2000L)) stop("Stored draw mismatch.")

            au <- ix[ix$Country == "AU", , drop=FALSE]
            nonau <- ix[ix$Country != "AU", , drop=FALSE]
            if (nrow(au) != 4L || nrow(nonau) != 52L) {
              stop("Expected 4 AU + 52 non-AU accepted posterior parts.")
            }

            cat("08I POSTERIOR GRID: PASS\n")
          '

          REF_GATE="$(find reference_08h -type f -name '00_dynamic_stability_source_gate.csv' -print -quit)"
          test -n "${REF_GATE}" || {
            echo "::error::08h reference gate not found."
            exit 1
          }

          if [ "${REF_GATE}" != "reference_08h/00_dynamic_stability_source_gate.csv" ]; then
            cp "${REF_GATE}" reference_08h/00_dynamic_stability_source_gate.csv
          fi

      - name: Run 08i domestic lag source diagnostic
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla R/64_domestic_lag_source_diagnostic.R

      - name: Show 08i diagnostic summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat results/domestic_lag_source/00_domestic_lag_source_gate.csv || true
          echo
          cat results/domestic_lag_source/README_08i_domestic_lag_source.txt || true

      - name: Upload 08i diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-08i-domestic-lag-source-${{ github.run_id }}
          path: results/domestic_lag_source/
          if-no-files-found: error
          retention-days: 30
