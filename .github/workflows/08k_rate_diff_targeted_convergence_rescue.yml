name: Financial 3var 08k Delta-r targeted convergence rescue

on:
  workflow_dispatch:
    inputs:
      source_08j_run_id:
        description: "08j source run providing the Delta-r input and original 56 posterior parts"
        required: true
        default: "33598683599"
        type: string
      source_08j_ref:
        description: "Exact head SHA of the 08j source run"
        required: true
        default: "13726636f2192987369ad6f8848badd5c960d611"
        type: string
      rescue_burn_per_chain:
        description: "Extended burn-in for targeted economies"
        required: true
        default: "7500"
        type: string
      rescue_postburn_per_chain:
        description: "Extended post-burn iterations for targeted economies"
        required: true
        default: "20000"
        type: string
      stored_per_chain:
        description: "Must stay 2000"
        required: true
        default: "2000"
        type: string
      seed_base:
        description: "Keep the 08j seed base"
        required: true
        default: "20260920"
        type: string
      diagnostic_draws_per_chain:
        description: "Balanced draws per chain for R63"
        required: true
        default: "250"
        type: string
      diagnostic_cores:
        description: "Parallel workers for R63"
        required: true
        default: "2"
        type: string
      max_parallel:
        description: "Maximum simultaneous rescue jobs"
        required: true
        default: "12"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify_source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_08j_run_id }}
      SOURCE_REF: ${{ inputs.source_08j_ref }}
      STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
    steps:
      - name: Checkout exact 08j source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_08j_ref }}

      - name: Verify source run and artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "${STORED_PER_CHAIN}" = "2000" || exit 1
          test "$(git rev-parse HEAD)" = "${SOURCE_REF}" || exit 1

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.status' <<<"${RUN_JSON}")" = "completed" || exit 1
          test "$(jq -r '.head_sha' <<<"${RUN_JSON}")" = "${SOURCE_REF}" || exit 1
          test "$(jq -r '.path' <<<"${RUN_JSON}")" = ".github/workflows/08j_rate_diff_formal_reestimation_and_stability.yml" || exit 1

          for f in R/00_config.R R/60_formal_bayesian_tvp_gvar.R R/61_formal_mcmc_diagnostics.R R/63_posterior_dynamic_stability_source_diagnostic.R R/65_rate_diff_formal_decision.R; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

          ART_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"

          PARTS="$(jq -r --arg rid "${SOURCE_RUN_ID}" '[.artifacts[] | select(.expired == false and (.name | startswith("financial-3var-08j-rate-diff-part-")) and (.name | endswith("-" + $rid)))] | length' <<<"${ART_JSON}")"
          INPUTS="$(jq -r --arg name "financial-3var-08j-rate-diff-input-${SOURCE_RUN_ID}" '[.artifacts[] | select(.expired == false and .name == $name)] | length' <<<"${ART_JSON}")"
          CONV="$(jq -r --arg name "financial-3var-08j-rate-diff-convergence-${SOURCE_RUN_ID}" '[.artifacts[] | select(.expired == false and .name == $name)] | length' <<<"${ART_JSON}")"

          echo "posterior parts=${PARTS}; input=${INPUTS}; convergence=${CONV}"
          test "${PARTS}" = "56" || exit 1
          test "${INPUTS}" = "1" || exit 1
          test "${CONV}" = "1" || exit 1
          echo "08K SOURCE INTEGRITY: PASS"

  rescue:
    needs: verify_source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        country: [AU, BR, CN, NO, SG, TR]
        chain: [1, 2, 3, 4]
    env:
      FIN3_COUNTRY: ${{ matrix.country }}
      FIN3_CHAIN_ID: ${{ matrix.chain }}
      FIN3_BURN: ${{ inputs.rescue_burn_per_chain }}
      FIN3_KEEP: ${{ inputs.rescue_postburn_per_chain }}
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_SEED_BASE: ${{ inputs.seed_base }}
      FIN3_TTVP_B1: "2"
      FIN3_TTVP_B2: "1"
      FIN3_TTVP_KAPPA0: "1e-4"
      FIN3_SV_ON: "true"
      FIN3_TVS_ON: "true"
      FIN3_FORMAL_PANEL: "data/derived/panel_domestic_fin3_rate_diff.csv"
    steps:
      - name: Checkout exact 08j source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_08j_ref }}

      - name: Download exact 08j Delta-r input
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-08j-rate-diff-input-${{ inputs.source_08j_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08j_run_id }}

      - name: Verify rescue contract
        shell: bash
        run: |
          set -euo pipefail
          test -f data/derived/panel_domestic_fin3_rate_diff.csv || exit 1
          test -f results/events/00_event_calendar.csv || exit 1
          test "${FIN3_STORED_PER_CHAIN}" = "2000" || exit 1
          test "${FIN3_TTVP_KAPPA0}" = "1e-4" || exit 1
          test "${FIN3_FORMAL_PANEL}" = "data/derived/panel_domestic_fin3_rate_diff.csv" || exit 1
          echo "country=${FIN3_COUNTRY}; chain=${FIN3_CHAIN_ID}; burn=${FIN3_BURN}; keep=${FIN3_KEEP}"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install formal dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::Rcpp
            any::RcppArmadillo
            any::stochvol
            any::GIGrvg
            any::MASS
            any::dlm
            any::snowfall

      - name: Install pinned threshtvp
        shell: bash
        run: |
          set -euo pipefail
          THRESHTVP_SHA="c0133f262fcf0f935805168f8b7def02b43dc6d5"
          rm -rf threshtvp_src
          git clone https://github.com/gregorkastner/threshtvp.git threshtvp_src
          git -C threshtvp_src checkout --detach "${THRESHTVP_SHA}"
          test "$(git -C threshtvp_src rev-parse HEAD)" = "${THRESHTVP_SHA}" || exit 1
          find threshtvp_src/src -maxdepth 1 -type f \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -delete
          R CMD INSTALL --preclean --clean --no-multiarch --with-keep.source threshtvp_src

      - name: Run extended Delta-r rescue MCMC
        run: Rscript --vanilla R/60_formal_bayesian_tvp_gvar.R

      - name: Validate rescued posterior metadata
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            cc <- Sys.getenv("FIN3_COUNTRY")
            ch <- as.integer(Sys.getenv("FIN3_CHAIN_ID"))
            f <- list.files(file.path("results","formal_tvp_parts",cc),
                            pattern=paste0("^formal_tvp_",cc,"_chain",ch,"[.]rds$"),
                            recursive=TRUE, full.names=TRUE)
            if (length(f) != 1L) stop("Expected one rescued posterior.")
            z <- readRDS(f)
            stopifnot(as.character(z$meta$country) == cc)
            stopifnot(as.integer(z$meta$chain) == ch)
            stopifnot(as.integer(z$meta$stored_draws) == 2000L)
            stopifnot(as.integer(z$meta$burn) == 7500L)
            stopifnot(as.integer(z$meta$keep_internal) == 20000L)
            stopifnot(basename(as.character(z$meta$source_panel)) == "panel_domestic_fin3_rate_diff.csv")
            cat("08K RESCUED POSTERIOR: PASS\n")
          '

      - name: Upload rescued posterior
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-08k-rate-diff-rescue-${{ matrix.country }}-chain${{ matrix.chain }}-${{ github.run_id }}
          path: results/formal_tvp_parts/${{ matrix.country }}/chain_${{ matrix.chain }}/
          if-no-files-found: error
          retention-days: 30

  diagnose:
    needs: [verify_source, rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE_RUN_ID: ${{ inputs.source_08j_run_id }}
      FIN3_PARTS_ROOT: posterior_parts
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_RHAT_TARGET: "1.01"
      FIN3_RHAT_HARD: "1.05"
      FIN3_ESS_TARGET: "400"
      FIN3_ESS_HARD: "100"
      FIN3_MIN_RHAT_TARGET_SHARE: "0.95"
      FIN3_MIN_ESS_TARGET_SHARE: "0.90"
    steps:
      - name: Checkout exact 08j source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_08j_ref }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install convergence dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::posterior

      - name: Download all original 08j posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-08j-rate-diff-part-*-${{ inputs.source_08j_run_id }}
          path: posterior_parts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08j_run_id }}

      - name: Remove superseded source parts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for cc in AU BR CN NO SG TR; do
            dirs=(posterior_parts/financial-3var-08j-rate-diff-part-${cc}-chain*-${SOURCE_RUN_ID})
            test "${#dirs[@]}" -eq 4 || { echo "::error::Expected 4 source dirs for ${cc}"; exit 1; }
            rm -rf "${dirs[@]}"
          done

      - name: Download 24 rescued posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-08k-rate-diff-rescue-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: false

      - name: Verify exact 32 retained plus 24 rescued posterior grid
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            source("R/00_config.R")
            targets <- c("AU","BR","CN","NO","SG","TR")
            fs <- list.files("posterior_parts",
                             pattern="^formal_tvp_[A-Z]{2}_chain[0-9]+[.]rds$",
                             recursive=TRUE, full.names=TRUE)
            if (length(fs) != 56L) stop("Expected 56 posterior files; found ", length(fs))
            ix <- do.call(rbind, lapply(fs, function(f) {
              z <- readRDS(f)
              data.frame(Country=as.character(z$meta$country),
                         Chain=as.integer(z$meta$chain),
                         Burn=as.integer(z$meta$burn),
                         Keep=as.integer(z$meta$keep_internal),
                         Stored=as.integer(z$meta$stored_draws),
                         Panel=basename(as.character(z$meta$source_panel)),
                         stringsAsFactors=FALSE)
            }))
            key <- paste(ix$Country, ix$Chain, sep="||")
            expected <- paste(rep(COUNTRIES, each=4), rep(1:4, times=length(COUNTRIES)), sep="||")
            if (anyDuplicated(key) || !setequal(key, expected)) stop("Country-chain grid mismatch.")
            if (any(ix$Stored != 2000L)) stop("Stored draws mismatch.")
            if (any(ix$Panel != "panel_domestic_fin3_rate_diff.csv")) stop("Non-Delta-r posterior detected.")
            rescued <- ix[ix$Country %in% targets,,drop=FALSE]
            retained <- ix[!ix$Country %in% targets,,drop=FALSE]
            if (nrow(rescued) != 24L || nrow(retained) != 32L) stop("Expected 24 rescued + 32 retained.")
            if (any(rescued$Burn != 7500L) || any(rescued$Keep != 20000L)) stop("Rescue chain length mismatch.")
            if (any(retained$Burn != 5000L) || any(retained$Keep != 10000L)) stop("Retained chain length mismatch.")
            dir.create("results/08k_rescue_audit", recursive=TRUE, showWarnings=FALSE)
            write.csv(ix, "results/08k_rescue_audit/00_mixed_posterior_index.csv", row.names=FALSE)
            cat("08K MIXED POSTERIOR GRID: PASS\n")
          '

      - name: Run R61 on mixed posterior
        run: Rscript --vanilla R/61_formal_mcmc_diagnostics.R

      - name: Show MCMC gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat results/formal_tvp/00_formal_mcmc_gate.csv || true
          echo
          cat results/formal_tvp/02_mcmc_country_summary.csv || true

      - name: Upload 08k convergence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-08k-rate-diff-convergence-${{ github.run_id }}
          path: |
            results/formal_tvp/
            results/08k_rescue_audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce rescued MCMC gate
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla -e '
            g <- read.csv("results/formal_tvp/00_formal_mcmc_gate.csv", stringsAsFactors=FALSE)
            if (nrow(g) != 1L || g$Status[1] != "READY_FOR_FORMAL_IRF") {
              print(g); stop("08k rescued Delta-r MCMC convergence gate failed.")
            }
            cat("08K MCMC: READY_FOR_FORMAL_IRF\n")
          '

  dynamic_stability:
    needs: [verify_source, rescue, diagnose]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: ${{ inputs.source_08j_run_id }}
      FIN3_PARTS_ROOT: posterior_parts
      FIN3_CONVERGENCE_DIR: results/formal_tvp
      FIN3_DYNAMIC_DIR: results/dynamic_stability_source
      FIN3_TRANSFORM_DIR: results/variable_transform
      FIN3_NCHAINS: "4"
      FIN3_STORED_PER_CHAIN: ${{ inputs.stored_per_chain }}
      FIN3_DIAG_DRAWS_PER_CHAIN: ${{ inputs.diagnostic_draws_per_chain }}
      FIN3_DIAG_CORES: ${{ inputs.diagnostic_cores }}
      FIN3_IRF_MIN_G0_RCOND: "1e-10"
      FIN3_LOO_COUNTRIES: "ZA,JP,BR,US,SG"
      FIN3_RATE_DIFF_MIN_ANCHOR_STABLE: "0.90"
      FIN3_RATE_DIFF_PANEL_BASENAME: "panel_domestic_fin3_rate_diff.csv"
    steps:
      - name: Checkout exact 08j source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_08j_ref }}

      - name: Download exact 08j prepared input
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-08j-rate-diff-input-${{ inputs.source_08j_run_id }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08j_run_id }}

      - name: Download all original 08j posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-08j-rate-diff-part-*-${{ inputs.source_08j_run_id }}
          path: posterior_parts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_08j_run_id }}

      - name: Remove superseded original parts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for cc in AU BR CN NO SG TR; do
            dirs=(posterior_parts/financial-3var-08j-rate-diff-part-${cc}-chain*-${SOURCE_RUN_ID})
            test "${#dirs[@]}" -eq 4 || exit 1
            rm -rf "${dirs[@]}"
          done

      - name: Download 24 rescued posterior artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: financial-3var-08k-rate-diff-rescue-*-${{ github.run_id }}
          path: posterior_parts
          merge-multiple: false

      - name: Download accepted 08k convergence artifact
        uses: actions/download-artifact@v4
        with:
          name: financial-3var-08k-rate-diff-convergence-${{ github.run_id }}
          path: convergence_download

      - name: Normalize accepted convergence files
        shell: bash
        run: |
          set -euo pipefail
          GATE="$(find convergence_download -type f -name '00_formal_mcmc_gate.csv' -print -quit)"
          test -n "${GATE}" || exit 1
          SRC_DIR="$(dirname "${GATE}")"
          rm -rf results/formal_tvp
          mkdir -p results/formal_tvp
          cp -a "${SRC_DIR}/." results/formal_tvp/
          Rscript --vanilla -e '
            g <- read.csv("results/formal_tvp/00_formal_mcmc_gate.csv", stringsAsFactors=FALSE)
            if (g$Status[1] != "READY_FOR_FORMAL_IRF") stop("Convergence artifact not accepted.")
          '

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Run R63 posterior dynamic stability
        run: Rscript --vanilla R/63_posterior_dynamic_stability_source_diagnostic.R

      - name: Run R65 Delta-r final decision
        id: final_gate
        continue-on-error: true
        run: Rscript --vanilla R/65_rate_diff_formal_decision.R

      - name: Show final results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DYNAMIC STABILITY ==="
          cat results/dynamic_stability_source/00_dynamic_stability_source_gate.csv || true
          echo
          echo "=== FINAL DELTA-R DECISION ==="
          cat results/rate_diff_decision/00_rate_diff_formal_gate.csv || true
          echo
          cat results/rate_diff_decision/01_rate_diff_formal_checks.csv || true

      - name: Upload 08k stability decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-08k-rate-diff-stability-decision-${{ github.run_id }}
          path: |
            results/dynamic_stability_source/
            results/rate_diff_decision/
            results/variable_transform/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce final decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f results/rate_diff_decision/00_rate_diff_formal_gate.csv || exit 1
          Rscript --vanilla -e '
            g <- read.csv("results/rate_diff_decision/00_rate_diff_formal_gate.csv", stringsAsFactors=FALSE)
            if (g$Status[1] != "RATE_DIFF_READY_FOR_IRF_RECODE") {
              print(g); stop("08k Delta-r specification is not ready for IRF recode.")
            }
            cat("08K FINAL: RATE_DIFF_READY_FOR_IRF_RECODE\n")
          '
