name: Financial 3var selected TVP 500-draw validation

on:
  workflow_dispatch:

jobs:
  selected-tvp-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      # Freeze the selected specification from the completed hyperparameter search.
      TVP_SMOKE_DRAWS: "500"
      TVP_SMOKE_SEED: "20260902"
      TVP_STATE_SCALE: "1e-6"
      TVP_PRIOR_SCALE: "0.02"

      # Keep the ORIGINAL gates. Do not loosen these to force READY.
      TVP_MIN_STABLE_SHARE: "0.90"
      TVP_RIDGE: "0.00000001"
      TVP_MIN_G0_RCOND: "0.0000000001"
      TVP_MAX_SPLIT_DIFF: "0.10"
      TVP_MAX_ABS_STD_BETA: "50"

      # Independent audit expectations.
      TVP_VALIDATION_EXPECTED_DRAWS: "500"
      TVP_VALIDATION_EXPECTED_STATE_SCALE: "1e-6"
      TVP_VALIDATION_EXPECTED_PRIOR_SCALE: "0.02"

    steps:
      - name: Checkout financial repository
        uses: actions/checkout@v4

      - name: Fetch validated macro inputs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/243e106e-coder/tvp-gvar-replication-private.git source_repo
          git -C source_repo sparse-checkout set 8.12

          test -f "source_repo/8.12/TVP_GVAR_14经济体_5变量_2000Q1_2026Q2_处理完成.xlsx" \
            || { echo "::error::Missing macro workbook"; exit 1; }
          test -f "source_repo/8.12/gpr_quarterly_processed.csv" \
            || { echo "::error::Missing GPR file"; exit 1; }
          test -f "source_repo/8.12/IMF_Brent_quarterly_log_2000Q1_2026Q2.csv" \
            || { echo "::error::Missing Brent file"; exit 1; }

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Install input dependency
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl

      - name: Build clean financial 3-variable panel
        run: Rscript --vanilla R/10_build_financial_3var_input.R

      - name: Validate financial weights
        run: Rscript --vanilla R/20_weight_preflight.R

      - name: Reconfirm p1 q1 global stability
        run: Rscript --vanilla R/30_stability_grid.R

      - name: Reconfirm static estimation gate
        run: Rscript --vanilla R/40_estimation_gate.R

      - name: Run fixed selected TVP specification at 500 draws
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results/tvp_selected_validation

          echo "Selected specification:"
          echo "  draws=${TVP_SMOKE_DRAWS}"
          echo "  seed=${TVP_SMOKE_SEED}"
          echo "  state_scale=${TVP_STATE_SCALE}"
          echo "  prior_scale=${TVP_PRIOR_SCALE}"
          echo "  min_stable_share=${TVP_MIN_STABLE_SHARE}"

          set +e
          Rscript --vanilla R/50_tvp_gvar_smoke_test.R \
            2>&1 | tee results/tvp_selected_validation/model_run.log
          rc=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$rc" > results/tvp_selected_validation/MODEL_EXIT_CODE.txt
          echo "TVP smoke-test exit code: $rc"

          # Exit 2 is the smoke-test's intentional model-gate failure code.
          # Do not fail here, because diagnostics must still be audited/uploaded.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::warning::Operational TVP error (exit $rc). Artifact upload will still be attempted."
          fi

      - name: Audit selected specification and original gates
        if: always()
        continue-on-error: true
        run: Rscript --vanilla R/52_selected_tvp_validation_audit.R

      - name: Show selected-spec validation summary
        if: always()
        shell: bash
        run: |
          echo "=== MODEL EXIT CODE ==="
          cat results/tvp_selected_validation/MODEL_EXIT_CODE.txt || true
          echo
          echo "=== SELECTED SPEC VALIDATION ==="
          cat results/tvp_selected_validation/README_selected_tvp_validation.txt || true
          echo
          echo "=== RAW TVP SMOKE GATE ==="
          cat results/tvp_smoke/README_tvp_smoke.txt || true

      - name: Upload selected TVP validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-3var-selected-tvp-500-validation-${{ github.run_id }}
          path: |
            data/derived/
            results/weights/
            results/stability/
            results/gate/
            results/tvp_smoke/
            results/tvp_selected_validation/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce final validation decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f results/tvp_selected_validation/MODEL_EXIT_CODE.txt ]; then
            echo "::error::Missing model exit-code file."
            exit 1
          fi

          model_rc=$(cat results/tvp_selected_validation/MODEL_EXIT_CODE.txt)
          if [ "$model_rc" -ne 0 ]; then
            if [ "$model_rc" -eq 2 ]; then
              echo "::error::Selected 500-draw TVP specification failed the original model gate."
            else
              echo "::error::Selected 500-draw TVP run had operational exit code $model_rc."
            fi
            exit 1
          fi

          if [ ! -f results/tvp_selected_validation/00_selected_spec_validation.csv ]; then
            echo "::error::Missing selected-spec validation audit output."
            exit 1
          fi

          Rscript --vanilla -e '
            d <- read.csv("results/tvp_selected_validation/00_selected_spec_validation.csv", stringsAsFactors=FALSE, check.names=FALSE)
            if (nrow(d) != 1L || !"FinalStatus" %in% names(d)) quit(status=1L)
            cat("FinalStatus:", d$FinalStatus[1], "\n")
            cat("PosteriorStableShare:", d$PosteriorStableShare[1], "\n")
            cat("SplitDifference:", d$SplitDifference[1], "\n")
            cat("WorstCountry:", d$WorstCountry[1], "stable share", d$WorstCountryStableShare[1], "\n")
            cat("WorstQuarter:", d$WorstQuarter[1], "stable share", d$WorstQuarterStableShare[1], "\n")
            if (!identical(as.character(d$FinalStatus[1]), "READY_FOR_FORMAL_TVP")) quit(status=1L)
          '
